 flessione del gomito superiore rispetto alla presa prona per via della posizione del bicipite.",biomeccanica:"La presa supina pone il bicipite in una posizione meccanicamente pi\xF9 favorevole (il capo lungo \xE8 gi\xE0 in leggera pre-tensione), motivo per cui questa variante \xE8 tipicamente pi\xF9 semplice da eseguire per la maggior parte delle persone rispetto alla presa prona \u2014 un compromesso tra lavoro dorsale e assistenza del bicipite.",errore:"Considerarla un esercizio equivalente alla presa prona per la schiena: il maggior coinvolgimento del bicipite significa che il dorsale riceve uno stimolo relativamente inferiore a parit\xE0 di ripetizioni \u2014 utile come variante, non come sostituto."},spal_alzate_frontali_cavo:{setup:"In piedi di fronte alla carrucola bassa, barra o maniglia impugnata con presa prona, braccio disteso verso il basso davanti al corpo.",esecuzione:"Sollevamento della barra in avanti fino all'altezza delle spalle, gomito con flessione minima costante, poi discesa controllata.",biomeccanica:"Il cavo mantiene tensione costante sul deltoide anteriore per tutto il ROM, incluso il punto pi\xF9 basso dove il manubrio (soggetto solo alla gravit\xE0 verticale) perde quasi completamente il carico \u2014 un vantaggio specifico di questa variante rispetto a quella con pesi liberi.",errore:"Usare uno slancio del busto o delle gambe per avviare il sollevamento: come nella variante con manubri, il movimento deve essere isolato alla sola articolazione della spalla."},spal_alzate_frontali_man:{setup:"In piedi, manubri tenuti lungo i fianchi o davanti alle cosce, presa prona o neutra.",esecuzione:"Sollevamento di uno o entrambi i manubri in avanti fino all'altezza delle spalle (non oltre), gomito con flessione minima e costante, poi discesa controllata.",biomeccanica:"Isola il deltoide anteriore nella sua funzione di flessione della spalla \u2014 un fascio che riceve comunque un lavoro indiretto significativo da tutte le spinte per petto e spalle, motivo per cui \xE8 spesso il fascio meno bisognoso di lavoro diretto aggiuntivo nella maggior parte dei programmi.",errore:"Usare slancio del busto (inarcandosi all'indietro) per sollevare il peso: il movimento deve venire esclusivamente dalla flessione della spalla, non da un'oscillazione del tronco."},spal_alzate_laterali:{setup:"In piedi, manubri lungo i fianchi, gomiti con leggera flessione fissa, busto stabile.",esecuzione:"Sollevamento laterale dei manubri fino a circa l'altezza delle spalle (non oltre, per evitare l'impingement del sovraspinato), leggera rotazione del polso verso il basso (mignolo leggermente pi\xF9 alto del pollice) nella fase alta, poi discesa controllata.",biomeccanica:"Isola il deltoide laterale (mediale) nella sua funzione di abduzione della spalla \u2014 il fascio che contribuisce maggiormente alla larghezza visiva delle spalle ed \xE8 tipicamente il pi\xF9 sotto-allenato dai movimenti di spinta compound, che coinvolgono prevalentemente il deltoide anteriore.",errore:"Sollevare oltre l'altezza delle spalle o usare slancio (rimbalzo) partendo dai fianchi: entrambi gli errori riducono l'isolamento e aumentano il rischio di conflitto sub-acromiale ripetuto."},spal_alzate_laterali_cavo:{setup:"In piedi di fianco alla carrucola bassa, maniglia impugnata con il braccio che attraversa il corpo, gomito con leggera flessione fissa.",esecuzione:"Sollevamento laterale del braccio fino all'altezza della spalla, poi discesa controllata mantenendo tensione sul cavo per tutto il ROM.",biomeccanica:"A differenza del manubrio, il cavo mantiene tensione anche nella posizione di partenza (braccio lungo il fianco, dove il manubrio ha braccio di leva quasi nullo rispetto alla gravit\xE0) \u2014 la tensione costante rende questa variante spesso pi\xF9 efficace per il deltoide laterale nell'intero ROM.",errore:"Posizionarsi troppo lontano o vicino alla carrucola: la distanza determina l'angolo di trazione del cavo rispetto al braccio, e quindi dove nel ROM si concentra il carico maggiore."},spal_alzate_posteriori_incl:{setup:"Prono su panca inclinata 30-45\xB0, petto appoggiato al cuscino, manubri tenuti sotto le spalle, gomiti con leggera flessione fissa.",esecuzione:"Sollevamento laterale delle braccia (le mani si allontanano dal corpo verso i lati) fino a circa l'altezza del busto, scapole che si retraggono leggermente a fine movimento, poi discesa controllata.",biomeccanica:"L'appoggio del petto elimina il compenso lombare, isolando il deltoide posteriore \u2014 il fascio tipicamente pi\xF9 debole e sotto-allenato dei tre, nonostante il suo ruolo importante nella postura e nella salute della spalla contro la protrazione cronica.",errore:"Sollevare le braccia troppo indietro/in alto trasformando il movimento in un rematore: l'enfasi sul deltoide posteriore richiede una traiettoria pi\xF9 laterale che verso l'alto \u2014 se il movimento assomiglia a un rematore a braccia larghe, il romboidi/trapezio stanno rubando lavoro al deltoide."},spal_lateral_raise_machine:{setup:"Seduto alla macchina, braccia appoggiate ai cuscini laterali o presa sulle maniglie secondo il design, gomiti con leggera flessione.",esecuzione:"Abduzione della spalla lungo la traiettoria guidata della macchina fino all'altezza indicata dal design, poi ritorno controllato.",biomeccanica:"La traiettoria vincolata e spesso la curva di resistenza a camma rendono questa la variante pi\xF9 sicura e isolata per il deltoide laterale, particolarmente utile per lavorare vicino al vero cedimento senza il rischio di compensi tipico dei manubri liberi quando la fatica aumenta.",errore:"Sollevare le spalle (elevazione scapolare) invece di abdurre il braccio: se il trapezio superiore interviene visibilmente, il movimento sta compensando invece di isolare il deltoide laterale."},spal_lento_avanti_mp:{setup:"In piedi o seduto sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle, bilanciere all'altezza delle clavicole.",esecuzione:"Spinta della barra verso l'alto lungo la traiettoria verticale fissa fino a quasi completa estensione, poi discesa controllata.",biomeccanica:"La traiettoria vincolata verticale del Multipower elimina il rischio di instabilit\xE0 laterale tipico della military press con bilanciere libero, permettendo di concentrarsi sul cedimento del deltoide anteriore in sicurezza.",errore:"Posizionarsi in modo che la traiettoria verticale della barra non passi vicino al viso durante la salita: se il percorso costringe a inclinare eccessivamente la testa indietro, la posizione sotto la barra va corretta."},spal_lento_man_seduto:{setup:"Seduto su panca con schienale verticale o leggermente inclinato, manubri all'altezza delle spalle, gomiti sotto i polsi, palmi in avanti o leggermente ruotati verso l'interno.",esecuzione:"Spinta dei manubri verso l'alto fino a quasi estendere completamente i gomiti (senza bloccarli con uno scatto), poi discesa controllata fino all'altezza delle spalle.",biomeccanica:"Movimento compound che carica primariamente il deltoide anteriore, con contributo significativo del deltoide laterale e del tricipite come sinergico nell'estensione del gomito \u2014 la posizione seduta con schienale elimina il compenso lombare tipico della variante in piedi.",errore:"Inarcare eccessivamente la parte bassa della schiena per aiutare la spinta finale: se lo schienale non impedisce questo compenso, la zona lombare sta assorbendo stress che dovrebbe restare sulla spalla."},spal_power_smith_vert:{setup:"Seduto alla macchina Power Smith verticale, presa sulle maniglie secondo la regolazione del sistema guidato.",esecuzione:"Spinta verso l'alto lungo il percorso fisso della macchina, che replica il movimento della shoulder press con manubri ma con stabilit\xE0 aggiuntiva.",biomeccanica:"Come per la variante Chest Press dello stesso sistema, il vantaggio \xE8 una traiettoria che si avvicina al movimento naturale della spalla pi\xF9 di un Multipower a binario puramente verticale, con la sicurezza di un sistema guidato.",errore:"Stesso di tutte le macchine guidate: una regolazione errata dell'altezza del sedile compromette l'allineamento articolare per l'intera serie."},spal_reverse_fly_pec_deck:{setup:"Seduto alla macchina Pec Deck usata in modalit\xE0 inversa (di fronte al cuscino, non con la schiena appoggiata), avambracci o mani sulle leve, braccia davanti al corpo.",esecuzione:"Apertura delle braccia verso l'esterno e indietro tramite abduzione orizzontale della spalla, scapole che si retraggono, poi ritorno controllato.",biomeccanica:"Versione a macchina delle alzate posteriori \u2014 offre spesso una curva di resistenza a camma e l'eliminazione completa di qualsiasi compenso del busto, rendendo pi\xF9 semplice l'isolamento del deltoide posteriore rispetto alla variante libera su panca inclinata.",errore:"Usare un carico eccessivo che costringe a usare la schiena per generare slancio: il movimento deve restare isolato alle braccia, con il busto fermo contro il cuscino frontale della macchina."},spal_shoulder_press_machine:{setup:"Seduto alla macchina, schienale regolato in modo che le maniglie siano all'altezza delle spalle, presa secondo il design della macchina.",esecuzione:"Spinta verso l'alto lungo la traiettoria fissa della macchina fino a quasi completa estensione, poi ritorno controllato.",biomeccanica:"La traiettoria vincolata elimina il compito di stabilizzazione multidirezionale richiesto dai manubri liberi, permettendo di caricare vicino al vero cedimento con margine di sicurezza superiore \u2014 particolarmente indicato per lavorare il deltoide anteriore a intensit\xE0 elevate secondo la filosofia HD.",errore:"Regolare male l'altezza del sedile: se le maniglie di partenza non sono all'altezza delle spalle, la traiettoria fissa della macchina forza un percorso scorretto per l'articolazione."},spal_shoulder_press_plate:{setup:"Seduto alla macchina a dischi/leva, schienale regolato, presa sulle maniglie.",esecuzione:"Spinta verso l'alto lungo la traiettoria guidata dalla leva della macchina, che tipicamente offre una curva di resistenza variabile lungo il ROM.",biomeccanica:"Le macchine a leva con dischi spesso offrono un braccio di leva variabile che si adatta alla curva di forza naturale del deltoide (pi\xF9 debole in posizione di massimo allungamento, pi\xF9 forte a met\xE0 ROM) meglio di una macchina a cavo con resistenza lineare.",errore:"Selezionare un carico basandosi solo sul numero di dischi senza considerare il moltiplicatore di leva della macchina: il carico effettivo percepito alla spalla pu\xF2 differire significativamente dal peso nominale caricato."},tric_chest_press_stretta:{setup:"Stessa macchina a pacco pesi usata per la Chest Press del petto, ma con presa stretta sulle maniglie (o mani ravvicinate sulla stessa maniglia, se la macchina non offre prese multiple), gomiti che puntano verso il basso/indietro.",esecuzione:"Spinta in avanti tramite estensione del gomito, con la traiettoria vincolata dalla macchina \u2014 il petto interviene come sinergico ma l'enfasi resta sul tricipite per via della presa ristretta.",biomeccanica:"Stesso principio della panca a presa stretta (l'angolo ristretto sposta il lavoro dal petto al tricipite) ma con la sicurezza e la traiettoria guidata della macchina \u2014 permette di caricare vicino al vero cedimento con rischio di instabilit\xE0 quasi nullo, coerente con la filosofia HD. Usare lo stesso macchinario del petto con due prese diverse \xE8 un modo efficiente di sfruttare un solo attrezzo per due gruppi muscolari.",errore:"Usare una presa larga per errore o comodit\xE0: vanifica lo scopo specifico dell'esercizio, che \xE8 distinguersi dalla Chest Press a presa larga proprio per l'enfasi sul tricipite data dalla presa ristretta."},tric_dip_due_panche:{setup:"Mani su una panca dietro il busto, talloni su un'altra panca di fronte (o piedi a terra per la variante pi\xF9 semplice), bacino sospeso tra le due, gomiti che iniziano estesi.",esecuzione:"Discesa flettendo i gomiti fino a un angolo di circa 90\xB0 (non oltre, per proteggere l'articolazione della spalla), poi spinta in estensione tramite i tricipiti.",biomeccanica:"Esercizio multiarticolare a corpo libero che carica il tricipite con una percentuale del peso corporeo \u2014 la profondit\xE0 della discesa determina il coinvolgimento del grande pettorale (pi\xF9 profondo = pi\xF9 petto) rispetto al tricipite (meno profondo, gomiti che restano pi\xF9 vicini al busto = pi\xF9 tricipite).",errore:"Scendere troppo in profondit\xE0: oltre i 90\xB0 di flessione del gomito, la testa dell'omero \xE8 sottoposta a uno stress anteriore significativo sulla capsula della spalla \u2014 la profondit\xE0 va limitata indipendentemente da quanto ROM aggiuntivo sembri disponibile."},tric_estensione_overhead_corda:{setup:"In piedi, di spalle alla carrucola bassa, corda agganciata, busto leggermente inclinato in avanti, gomiti puntati verso l'alto sopra la testa a inizio movimento (posizione di massima flessione).",esecuzione:"Estensione del gomito portando la corda in avanti/verso l'alto, mantenendo l'omero fisso vicino alla testa \u2014 solo l'avambraccio si muove.",biomeccanica:"La posizione overhead pone il capo lungo del tricipite (l'unico dei tre capi che attraversa anche l'articolazione della spalla, oltre al gomito) in massimo allungamento \u2014 \xE8 la configurazione pi\xF9 efficace per stimolare specificamente questo capo, secondo il principio dello stretch-mediated hypertrophy.",errore:"Muovere l'omero avanti e indietro insieme all'avambraccio: il braccio superiore deve restare fisso vicino alla testa, il movimento \xE8 isolato al gomito \u2014 se le spalle oscillano, l'allungamento specifico del capo lungo si perde."},tric_estensione_overhead_medio:{setup:"In piedi, di spalle alla carrucola all'altezza media (non bassa come l'altra variante overhead), corda agganciata, gomiti puntati verso l'alto a inizio movimento.",esecuzione:"Estensione del gomito con la stessa meccanica della variante da carrucola bassa, ma l'angolazione del cavo rispetto al corpo cambia leggermente il punto del ROM dove la tensione \xE8 massima.",biomeccanica:"Variare l'altezza della carrucola per lo stesso movimento overhead sposta il picco di tensione lungo il ROM \u2014 la carrucola media tende a mantenere tensione pi\xF9 costante nella fase intermedia del movimento rispetto alla carrucola bassa, che carica maggiormente l'inizio (posizione di massimo allungamento).",errore:"Stesso della variante da carrucola bassa: muovere l'omero invece di tenerlo fisso vicino alla testa vanifica l'enfasi specifica sul capo lungo."},tric_estensione_unilat:{setup:"In piedi o seduto di fianco alla carrucola bassa, un braccio alla volta, gomito bloccato vicino alla testa o al fianco secondo la variante, maniglia impugnata.",esecuzione:"Estensione del gomito in isolamento completo su un solo braccio, permettendo un controllo del ROM e della traiettoria impossibile da replicare con un attrezzo bilaterale.",biomeccanica:"L'esecuzione unilaterale permette di correggere asimmetrie di forza tra i due bracci e di concentrare l'attenzione propriocettiva su un singolo tricipite alla volta \u2014 utile in fase di rifinitura o riabilitazione dopo un infortunio a un solo lato.",errore:"Ruotare il busto per generare slancio quando il carico \xE8 vicino al cedimento: la rotazione del tronco introduce un contributo esterno che maschera la reale capacit\xE0 del tricipite isolato."},tric_french_press_ez:{setup:"Sdraiato su panca piana, bilanciere EZ impugnato a presa stretta, braccia estese verticalmente sopra il petto.",esecuzione:"Flessione dei gomiti abbassando la barra verso la fronte o dietro la testa (secondo la variante), poi estensione riportando la barra sopra il petto.",biomeccanica:"La barra EZ riduce lo stress rotazionale sul polso rispetto alla barra dritta durante un movimento in cui il polso \xE8 gi\xE0 in una posizione vulnerabile (sopra la testa, vicino al cedimento) \u2014 stessa logica di allungamento del capo lungo della variante con manubri, ma con un carico unico invece che bilaterale indipendente.",errore:"Scendere troppo indietro verso la nuca invece che verso la fronte: aumenta il rischio per la spalla senza benefici aggiuntivi per il tricipite \u2014 la traiettoria verso la fronte \xE8 generalmente la scelta pi\xF9 sicura."},tric_french_press_man:{setup:"Sdraiato su panca piana, un manubrio per mano (o uno tenuto a due mani) sopra il petto, braccia estese verticalmente, poi gomiti che si flettono portando i pesi verso le tempie.",esecuzione:"Estensione del gomito riportando i manubri verso l'alto, mantenendo l'omero verticale e fermo per tutta la serie \u2014 solo l'avambraccio si muove nello spazio.",biomeccanica:"Con le braccia verticali sopra la testa (l'omero in flessione di spalla completa), il capo lungo del tricipite \xE8 in posizione allungata in modo simile all'estensione overhead in piedi, ma con il vantaggio della stabilit\xE0 offerta dalla panca contro compensi del busto.",errore:"Lasciare che i gomiti si allarghino verso l'esterno durante la discesa: devono restare puntati verso il soffitto (o leggermente verso la testa), non divaricarsi \u2014 l'allargamento riduce l'isolamento e aumenta lo stress sull'articolazione."},tric_kickback:{setup:"Busto flesso in avanti a circa 90\xB0 (appoggiato con una mano/ginocchio su una panca per stabilit\xE0), braccio superiore parallelo al busto e fermo, gomito flesso a 90\xB0, manubrio in mano.",esecuzione:"Estensione del gomito portando l'avambraccio indietro fino alla linea del busto, mantenendo il braccio superiore (omero) perfettamente fermo e parallelo al pavimento per tutto il movimento.",biomeccanica:"Con l'omero fisso in posizione orizzontale, questo \xE8 uno dei pochi esercizi che isola il tricipite nel punto del ROM di massima contrazione (braccio completamente disteso all'indietro) \u2014 un angolo che pushdown ed estensioni overhead non replicano con la stessa specificit\xE0.",errore:"Muovere il braccio superiore insieme all'avambraccio (come un colpo di remo): se l'omero si sposta, il movimento si trasforma in un'estensione di spalla assistita dal dorsale, perdendo l'isolamento del tricipite che \xE8 la ragione d'essere di questo esercizio."},tric_panca_stretta_bil:{setup:"Sdraiato su panca piana, bilanciere impugnato a presa stretta (circa larghezza spalle), gomiti che puntano verso i piedi.",esecuzione:"Discesa controllata verso la parte bassa dello sterno, gomiti vicini al busto, poi spinta in estensione. A differenza del Multipower, qui \xE8 richiesta stabilizzazione attiva del bilanciamento laterale della barra.",biomeccanica:"Stessa logica della variante Multipower (enfasi tricipite via presa stretta) ma con la richiesta aggiuntiva di stabilizzazione propriocettiva tipica del carico libero \u2014 il compound pi\xF9 completo per il tricipite in termini di reclutamento muscolare, a costo di una gestione della sicurezza pi\xF9 delicata vicino al cedimento.",errore:"Stesso della variante guidata (gomiti che si allargano), con l'aggravante che qui un cedimento improvviso della stabilit\xE0 laterale del bilanciere \xE8 un rischio reale \u2014 l'uso di un partner spotter o di safety bar \xE8 consigliato vicino al vero cedimento."},tric_panca_stretta_mp:{setup:"Sdraiato su panca piana sotto la barra del Multipower, presa stretta (circa larghezza spalle o poco meno), gomiti che puntano verso i piedi, non verso l'esterno.",esecuzione:"Discesa della barra verso la parte bassa dello sterno mantenendo i gomiti vicini al busto, poi spinta in estensione. La traiettoria fissa verticale del Multipower elimina la necessit\xE0 di stabilizzare il bilanciamento laterale.",biomeccanica:"La presa stretta sposta l'enfasi dal grande pettorale (dominante nella presa larga) verso il tricipite, che diventa il motore primario dell'estensione del gomito in questo compound \u2014 un ibrido tra esercizio di spinta per petto e per tricipite, con dominanza tricipite grazie alla presa ristretta.",errore:"Allargare troppo i gomiti durante la discesa: oltre a ridurre l'enfasi sul tricipite, aumenta lo stress sull'articolazione della spalla in una posizione di rotazione interna forzata."},tric_pushdown_barra:{setup:"Di fronte alla carrucola alta, barra dritta o a V agganciata, presa prona, gomiti bloccati ai fianchi.",esecuzione:"Estensione del gomito spingendo la barra verso il basso fino a braccia quasi completamente distese, poi ritorno controllato.",biomeccanica:"A differenza della corda, la barra rigida vincola la traiettoria del polso in un piano fisso \u2014 pi\xF9 semplice da controllare per chi inizia con questo movimento, ma senza il beneficio della separazione finale che la corda offre per l'accorciamento completo del muscolo.",errore:"Bloccare i gomiti con uno scatto secco a fine ripetizione: l'estensione completa va raggiunta con controllo, non con un blocco brusco dell'articolazione che scarica stress sull'olecrano."},tric_pushdown_corda:{setup:"Di fronte alla carrucola alta, corda agganciata, gomiti bloccati ai fianchi, leggera inclinazione del busto in avanti.",esecuzione:"Estensione del gomito spingendo la corda verso il basso, separando le due estremit\xE0 della corda alla fine del movimento per massimizzare l'accorciamento del tricipite.",biomeccanica:"La corda, a differenza della barra rigida, permette una leggera rotazione del polso e la separazione finale che i capi laterale e mediale del tricipite sfruttano per raggiungere un accorciamento pi\xF9 completo rispetto a un attrezzo con presa fissa.",errore:"Gomiti che si staccano dai fianchi e vanno in avanti: trasforma il movimento in una spinta con coinvolgimento di spalla e petto, diluendo lo stimolo specifico sul tricipite."},x1:{setup:"Su panca 45\xB0, bacino appoggiato sul cuscino con le anche libere di flettersi, caviglie bloccate sotto i rulli, busto che parte flesso in avanti verso il pavimento.",esecuzione:"Estensione del busto tramite contrazione degli erettori spinali e dei glutei, fino a portare la colonna in linea retta con le gambe \u2014 mai oltre, l'iperestensione della zona lombare oltre la neutralit\xE0 non \xE8 l'obiettivo e aumenta lo stress sui dischi intervertebrali.",biomeccanica:"Allena gli erettori spinali (il gruppo muscolare paravertebrale) in un movimento di estensione controllata dell'anca e della colonna \u2014 un gruppo cronicamente sotto-allenato rispetto agli addominali nella maggior parte dei programmi, nonostante il suo ruolo centrale nella stabilit\xE0 della colonna durante stacchi e squat.",errore:"Iperestendere oltre la linea retta arcuando vistosamente la parte bassa della schiena all'apice del movimento: l'obiettivo \xE8 tornare alla neutralit\xE0 della colonna, non superarla \u2014 l'iperestensione ripetuta sotto carico \xE8 una delle cause pi\xF9 comuni di fastidio lombare in questo esercizio."},x11:{setup:"In piedi di fianco alla carrucola bassa (dal lato opposto rispetto all'extra-rotazione), gomito a 90\xB0 contro il fianco, un asciugamano arrotolato sotto l'ascella per mantenere una leggera abduzione, maniglia impugnata con l'avambraccio che parte ruotato verso l'esterno.",esecuzione:"Ruota l'avambraccio verso l'interno portandolo davanti all'addome, gomito sempre fisso contro il fianco.",biomeccanica:"Allena gli intrarotatori (sottoscapolare principalmente), il complemento funzionale degli extrarotatori \u2014 un corretto bilanciamento di forza tra rotatori interni ed esterni (tipicamente un rapporto vicino a 3:2 a favore degli intrarotatori) \xE8 associato a una minore incidenza di infortuni alla cuffia.",errore:"Omettere l'asciugamano sotto l'ascella: senza quel distanziatore, il braccio tende ad addursi contro il fianco durante il movimento, riducendo il ROM reale della rotazione."},x12:{setup:"In piedi al centro tra due carrucole regolate all'altezza del petto, braccio destro che afferra la maniglia sinistra e viceversa (le braccia si incrociano davanti al corpo), gomiti con leggera flessione fissa.",esecuzione:"Apertura delle braccia verso l'esterno e leggermente indietro tramite abduzione orizzontale della spalla, scapole che si retraggono, poi ritorno controllato all'incrocio.",biomeccanica:"L'incrocio iniziale delle braccia aumenta il ROM disponibile per l'abduzione orizzontale rispetto a partire con le mani gi\xE0 ai lati, permettendo un maggiore allungamento del deltoide posteriore all'inizio del movimento \u2014 una variante del reverse fly con enfasi sull'allungamento iniziale.",errore:"Non incrociare abbastanza le braccia all'inizio: se la posizione di partenza non \xE8 visibilmente incrociata, si perde il vantaggio di ROM aggiuntivo che distingue questa variante da un normale reverse fly ai cavi."},x13:{setup:"Posizione di plank/push-up con braccia tese, mani leggermente pi\xF9 larghe delle spalle.",esecuzione:"Senza flettere i gomiti, spingi il busto verso l'alto tramite protrazione della scapola (le scapole si allontanano dalla colonna, la parte alta della schiena si arrotonda leggermente), poi ritorna controllando la retrazione.",biomeccanica:"Isola il dentato anteriore, muscolo spesso trascurato che stabilizza la scapola contro la gabbia toracica durante i movimenti di spinta \u2014 una sua debolezza \xE8 associata a scapola alata e ridotta efficienza in tutti gli esercizi di spinta per petto e spalle.",errore:"Flettere i gomiti durante il movimento: il 'plus' del push-up plus \xE8 specificamente il movimento scapolare aggiuntivo a braccia tese, se i gomiti si piegano diventa un push-up normale e il dentato anteriore non viene isolato."},x14:{setup:"Appoggio su avambracci e punte dei piedi, gomiti allineati sotto le spalle, corpo in linea retta da testa a talloni.",esecuzione:"Mantenimento della posizione tramite contrazione isometrica di tutto il core \u2014 addome, obliqui, lombari, glutei \u2014 per il tempo stabilito, senza cedimenti n\xE9 compensi.",biomeccanica:"A differenza degli esercizi dinamici, il plank allena la capacit\xE0 del core di resistere all'estensione lombare sotto carico gravitazionale (anti-estensione) \u2014 \xE8 la stessa funzione che il core svolge durante lo squat o lo stacco per proteggere la colonna, motivo per cui viene classificato come lavoro funzionale/di supporto piuttosto che di isolamento.",errore:"Bacino che cade verso il basso (iperestensione lombare) o si alza troppo (perdita della linea retta): entrambi indicano che il core ha ceduto e il carico si sta scaricando sulla colonna invece che sui muscoli addominali."},x2:{setup:"Sdraiato alla Leg Press orizzontale (stessa posizione della Calf Press ma con enfasi opposta), ginocchia distese, ma il movimento avviene con la punta del piede verso l'alto anzich\xE9 verso il basso.",esecuzione:"Dorsiflessione della caviglia tirando la punta del piede verso lo stinco contro la resistenza della pedana, poi ritorno controllato.",biomeccanica:"Allena il tibiale anteriore, il muscolo della parte anteriore della tibia responsabile della dorsiflessione \u2014 antagonista funzionale del tricipite surale (polpaccio), spesso completamente trascurato nei programmi di ipertrofia nonostante il suo ruolo nella prevenzione di squilibri di forza caviglia-correlati e nella stabilit\xE0 della camminata/corsa.",errore:"Ignorare questo esercizio considerandolo superfluo: uno squilibrio marcato tra la forza del polpaccio (plantarflessori) e quella del tibiale anteriore (dorsiflessori) \xE8 un fattore di rischio documentato per infortuni alla caviglia e alla tibia (periostite) in chi corre o pratica sport con cambi di direzione."},x3:{setup:"In piedi sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle, braccia completamente distese, bilanciere all'altezza del bacino.",esecuzione:"Solleva le spalle verso le orecchie in un movimento verticale puro, senza rotazione \u2014 la traiettoria del Multipower elimina comunque la tentazione di 'rotolare' le spalle, mantenendo il movimento pulito. Pausa di un istante alla massima contrazione, poi discesa controllata.",biomeccanica:"Isola il trapezio superiore, la cui azione primaria \xE8 elevare la scapola \u2014 la traiettoria verticale fissa del Multipower \xE8 particolarmente indicata qui perch\xE9 elimina il rischio (presente col bilanciere libero) di oscillare in avanti/indietro cercando di compensare lo sbilanciamento del carico.",errore:"Flettere i gomiti per 'aiutare' il sollevamento: le braccia devono restare completamente passive e distese, il movimento \xE8 esclusivamente un'elevazione scapolare \u2014 se i gomiti si piegano, i bicipiti stanno rubando lavoro al trapezio."},x15:{setup:"Prono su panca inclinata 30-45\xB0, petto appoggiato al cuscino, manubri leggeri in mano, braccia tese verso il basso a inizio movimento.",esecuzione:`Sollevamento delle braccia disegnando una "Y" \u2014 non lateralmente come nelle alzate posteriori, ma diagonalmente verso l'alto, pollici che ruotano verso l'esterno a fine corsa, scapole che si retraggono e si abbassano insieme, poi discesa controllata.`,biomeccanica:"A differenza delle Scrollate (che elevano la scapola, isolando il trapezio superiore), il movimento a Y allena specificamente il trapezio medio e inferiore nella loro funzione di retrazione e depressione scapolare \u2014 il fascio che stabilizza la scapola durante i movimenti overhead e che, se debole, contribuisce alla postura con spalle arrotolate in avanti. Il carico resta volutamente leggero: \xE8 un lavoro di controllo motorio e resistenza posturale, non di forza massimale.",errore:"Usare manubri troppo pesanti che costringono a sostituire il movimento con uno slancio del busto o un'elevazione delle spalle verso le orecchie (trapezio superiore che compensa): il trapezio medio/basso \xE8 intrinsecamente debole rispetto al superiore, il carico va tenuto leggero per isolarlo davvero."},x16:{setup:"Sdraiato supino su panca, testa oltre il bordo, piccolo disco tenuto con entrambe le mani appoggiato sulla fronte.",esecuzione:"Flessione del collo sollevando la testa in avanti contro la resistenza del disco, poi ritorno controllato fino a un leggero allungamento all'indietro (senza forzare l'estensione).",biomeccanica:"Allena i flessori profondi e superficiali del collo (lungo del collo, scaleni, sternocleidomastoideo), muscoli quasi sempre assenti dai programmi di ipertrofia standard nonostante il loro ruolo nella stabilit\xE0 cervicale \u2014 rilevante per chi pratica sport da contatto, ma utile anche solo per bilanciare la postura in chi passa molte ore con la testa proiettata in avanti (uso prolungato di schermi).",errore:"Usare un carico eccessivo o un ROM ampio fin da subito: il collo \xE8 un distretto delicato con muscoli piccoli \u2014 si parte con dischi molto leggeri (1-2.5kg) e ROM ridotto, aumentando gradualmente nel tempo."},x17:{setup:"Prono su panca, testa oltre il bordo, piccolo disco tenuto con entrambe le mani appoggiato sulla nuca (o cinghia dedicata se disponibile).",esecuzione:"Estensione del collo sollevando la testa all'indietro contro la resistenza del disco, poi ritorno controllato fino a un leggero allungamento in avanti (senza forzare la flessione).",biomeccanica:"Allena gli estensori del collo (splenio, semispinale, trapezio superiore in parte), il gruppo opposto e complementare ai flessori \u2014 un buon equilibrio di forza tra flessori ed estensori del collo riduce il rischio di infortunio cervicale negli sport di contatto ed \xE8 protettivo per la postura generale del tratto cervicale.",errore:"Stesso principio della flessione: carico e ROM minimi all'inizio, progressione molto pi\xF9 lenta rispetto ai grandi gruppi muscolari \u2014 il collo tollera meno stress improvviso di quanto suggerisca la sua apparente resistenza quotidiana."},x5:{setup:"In piedi di fronte alla carrucola alta, corda agganciata, braccia tese in avanti all'altezza del viso.",esecuzione:"Trazione della corda verso il viso separando le due estremit\xE0, gomiti che si alzano lateralmente sopra il livello delle spalle, con leggera extra-rotazione della spalla nella fase finale.",biomeccanica:"Esercizio ibrido che allena simultaneamente il deltoide posteriore, il trapezio medio/inferiore, i romboidi e gli extrarotatori della cuffia \u2014 spesso considerato un esercizio 'correttivo' per contrastare la postura con spalle protratte in avanti tipica di chi allena molto le spinte per petto.",errore:"Tirare la corda verso il petto invece che verso il viso, con i gomiti bassi: cambia completamente l'enfasi muscolare, trasformandolo in una via di mezzo tra un rematore e un'alzata posteriore, perdendo la specificit\xE0 sulla cuffia e sul trapezio medio."},x7:{setup:"In piedi di fianco alla carrucola bassa, gomito piegato a 90\xB0 e bloccato contro il fianco, avambraccio parallelo al terreno davanti al corpo, maniglia impugnata.",esecuzione:"Ruota l'avambraccio verso l'esterno (extra-rotazione della spalla) mantenendo il gomito fisso contro il fianco per tutto il movimento \u2014 solo l'articolazione della spalla ruota, non il gomito n\xE9 il busto.",biomeccanica:"Allena gli extrarotatori della cuffia (sovraspinato, infraspinato, piccolo rotondo), muscoli piccoli che stabilizzano la testa dell'omero nella glena durante ogni movimento di spinta e trazione sopra la testa \u2014 un deficit di forza in extra-rotazione \xE8 uno dei fattori di rischio pi\xF9 documentati per il conflitto sub-acromiale.",errore:"Staccare il gomito dal fianco per aumentare il ROM apparente: il movimento deve avvenire esclusivamente per rotazione dell'omero nella sua sede articolare, non per spostamento del braccio nello spazio."},x8:{setup:"In piedi di fronte alla carrucola alta, doppia maniglia o barra impugnata, braccia tese in avanti all'altezza delle spalle.",esecuzione:"Senza flettere i gomiti, retrai le scapole tirandole verso la colonna e leggermente verso il basso, poi ritorna controllando la protrazione. Il movimento delle braccia nello spazio \xE8 minimo \u2014 il lavoro \xE8 quasi interamente scapolare.",biomeccanica:"Isola i romboidi e il trapezio medio-inferiore, i muscoli che retraggono e stabilizzano la scapola in postura corretta \u2014 spesso deboli rispetto al grande pettorale e al gran dorsale nella popolazione che si allena prevalentemente su panca e lat machine, contribuendo alla postura con spalle protratte in avanti.",errore:"Usare i bicipiti per tirare (flettendo i gomiti): il movimento corretto avviene interamente nella scapola, le braccia restano quasi rigide \u2014 se i gomiti si piegano visibilmente, il dentato/romboidi stanno perdendo il lavoro a favore dei flessori del gomito."}},ce=zz.map(Xz),bc=["Bilanciere","Manubri","Cavi","Macchina","Multipower","Panatta","Panca","Corpo Libero"],Ac=null;function Qz(e){Ac=Array.isArray(e)&&e.length>0?new Set(e):null}var Sp=null;function Yz(e){let a=parseFloat(String(e??"").replace(",","."));Sp=a>0?a:null}function Gl(){return Sp}var mr=[];function Kz(e){mr=(Array.isArray(e)?e:[]).filter(a=>a&&a.date&&a.kg>0).sort((a,t)=>a.date.localeCompare(t.date))}function Jz(e){if(!mr.length||!e)return Sp;let a=mr[0];return mr.forEach(t=>{t.date<=e&&(a=t)}),a.kg}function eL(e,a,t=Ie()){let o=parseFloat(String(a??"").replace(",","."));return o>0?[...(e||[]).filter(i=>i.date!==t),{date:t,kg:Math.round(o*10)/10}].sort((i,l)=>i.date.localeCompare(l.date)):e||[]}var Lv=6.8,aL=6,tL=5,Di=[0,...Array.from({length:aL},(e,a)=>Math.round((a+1)*Lv*10)/10).flatMap(e=>[e,Math.round((e+tL)*10)/10])].sort((e,a)=>e-a),pr=e=>String(e).replace(".",",");function zp(e){let a=Number(e)||0;return Di.reduce((t,o)=>Math.abs(o-a)<Math.abs(t-a)?o:t,Di[0])}function lp(e,a=null){let t=zp(e),o=Di.filter(i=>i<t);return o.length?a===null?o[o.length-1]:o.reduce((i,l)=>Math.abs(l-a)<Math.abs(i-a)?l:i,o[o.length-1]):null}function Cv(e){let a=zp(e);return Di.find(t=>t>a)??a}var Fl=e=>(Number(e)||0)<=Di[Di.length-1]+.01,Lp=`pacco ${Di.filter(e=>e>0&&Math.round(e/Lv*10)%10===0).map(pr).join(" \xB7 ")} kg, levetta +5`;fun
