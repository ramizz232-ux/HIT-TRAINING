 diverse \xE8 un modo efficiente di sfruttare un solo attrezzo per due gruppi muscolari.",errore:"Usare una presa larga per errore o comodit\xE0: vanifica lo scopo specifico dell'esercizio, che \xE8 distinguersi dalla Chest Press a presa larga proprio per l'enfasi sul tricipite data dalla presa ristretta."},tric_dip_due_panche:{setup:"Mani su una panca dietro il busto, talloni su un'altra panca di fronte (o piedi a terra per la variante pi\xF9 semplice), bacino sospeso tra le due, gomiti che iniziano estesi.",esecuzione:"Discesa flettendo i gomiti fino a un angolo di circa 90\xB0 (non oltre, per proteggere l'articolazione della spalla), poi spinta in estensione tramite i tricipiti.",biomeccanica:"Esercizio multiarticolare a corpo libero che carica il tricipite con una percentuale del peso corporeo \u2014 la profondit\xE0 della discesa determina il coinvolgimento del grande pettorale (pi\xF9 profondo = pi\xF9 petto) rispetto al tricipite (meno profondo, gomiti che restano pi\xF9 vicini al busto = pi\xF9 tricipite).",errore:"Scendere troppo in profondit\xE0: oltre i 90\xB0 di flessione del gomito, la testa dell'omero \xE8 sottoposta a uno stress anteriore significativo sulla capsula della spalla \u2014 la profondit\xE0 va limitata indipendentemente da quanto ROM aggiuntivo sembri disponibile."},tric_estensione_overhead_corda:{setup:"In piedi, di spalle alla carrucola bassa, corda agganciata, busto leggermente inclinato in avanti, gomiti puntati verso l'alto sopra la testa a inizio movimento (posizione di massima flessione).",esecuzione:"Estensione del gomito portando la corda in avanti/verso l'alto, mantenendo l'omero fisso vicino alla testa \u2014 solo l'avambraccio si muove.",biomeccanica:"La posizione overhead pone il capo lungo del tricipite (l'unico dei tre capi che attraversa anche l'articolazione della spalla, oltre al gomito) in massimo allungamento \u2014 \xE8 la configurazione pi\xF9 efficace per stimolare specificamente questo capo, secondo il principio dello stretch-mediated hypertrophy.",errore:"Muovere l'omero avanti e indietro insieme all'avambraccio: il braccio superiore deve restare fisso vicino alla testa, il movimento \xE8 isolato al gomito \u2014 se le spalle oscillano, l'allungamento specifico del capo lungo si perde."},tric_estensione_overhead_medio:{setup:"In piedi, di spalle alla carrucola all'altezza media (non bassa come l'altra variante overhead), corda agganciata, gomiti puntati verso l'alto a inizio movimento.",esecuzione:"Estensione del gomito con la stessa meccanica della variante da carrucola bassa, ma l'angolazione del cavo rispetto al corpo cambia leggermente il punto del ROM dove la tensione \xE8 massima.",biomeccanica:"Variare l'altezza della carrucola per lo stesso movimento overhead sposta il picco di tensione lungo il ROM \u2014 la carrucola media tende a mantenere tensione pi\xF9 costante nella fase intermedia del movimento rispetto alla carrucola bassa, che carica maggiormente l'inizio (posizione di massimo allungamento).",errore:"Stesso della variante da carrucola bassa: muovere l'omero invece di tenerlo fisso vicino alla testa vanifica l'enfasi specifica sul capo lungo."},tric_estensione_unilat:{setup:"In piedi o seduto di fianco alla carrucola bassa, un braccio alla volta, gomito bloccato vicino alla testa o al fianco secondo la variante, maniglia impugnata.",esecuzione:"Estensione del gomito in isolamento completo su un solo braccio, permettendo un controllo del ROM e della traiettoria impossibile da replicare con un attrezzo bilaterale.",biomeccanica:"L'esecuzione unilaterale permette di correggere asimmetrie di forza tra i due bracci e di concentrare l'attenzione propriocettiva su un singolo tricipite alla volta \u2014 utile in fase di rifinitura o riabilitazione dopo un infortunio a un solo lato.",errore:"Ruotare il busto per generare slancio quando il carico \xE8 vicino al cedimento: la rotazione del tronco introduce un contributo esterno che maschera la reale capacit\xE0 del tricipite isolato."},tric_french_press_ez:{setup:"Sdraiato su panca piana, bilanciere EZ impugnato a presa stretta, braccia estese verticalmente sopra il petto.",esecuzione:"Flessione dei gomiti abbassando la barra verso la fronte o dietro la testa (secondo la variante), poi estensione riportando la barra sopra il petto.",biomeccanica:"La barra EZ riduce lo stress rotazionale sul polso rispetto alla barra dritta durante un movimento in cui il polso \xE8 gi\xE0 in una posizione vulnerabile (sopra la testa, vicino al cedimento) \u2014 stessa logica di allungamento del capo lungo della variante con manubri, ma con un carico unico invece che bilaterale indipendente.",errore:"Scendere troppo indietro verso la nuca invece che verso la fronte: aumenta il rischio per la spalla senza benefici aggiuntivi per il tricipite \u2014 la traiettoria verso la fronte \xE8 generalmente la scelta pi\xF9 sicura."},tric_french_press_man:{setup:"Sdraiato su panca piana, un manubrio per mano (o uno tenuto a due mani) sopra il petto, braccia estese verticalmente, poi gomiti che si flettono portando i pesi verso le tempie.",esecuzione:"Estensione del gomito riportando i manubri verso l'alto, mantenendo l'omero verticale e fermo per tutta la serie \u2014 solo l'avambraccio si muove nello spazio.",biomeccanica:"Con le braccia verticali sopra la testa (l'omero in flessione di spalla completa), il capo lungo del tricipite \xE8 in posizione allungata in modo simile all'estensione overhead in piedi, ma con il vantaggio della stabilit\xE0 offerta dalla panca contro compensi del busto.",errore:"Lasciare che i gomiti si allarghino verso l'esterno durante la discesa: devono restare puntati verso il soffitto (o leggermente verso la testa), non divaricarsi \u2014 l'allargamento riduce l'isolamento e aumenta lo stress sull'articolazione."},tric_kickback:{setup:"Busto flesso in avanti a circa 90\xB0 (appoggiato con una mano/ginocchio su una panca per stabilit\xE0), braccio superiore parallelo al busto e fermo, gomito flesso a 90\xB0, manubrio in mano.",esecuzione:"Estensione del gomito portando l'avambraccio indietro fino alla linea del busto, mantenendo il braccio superiore (omero) perfettamente fermo e parallelo al pavimento per tutto il movimento.",biomeccanica:"Con l'omero fisso in posizione orizzontale, questo \xE8 uno dei pochi esercizi che isola il tricipite nel punto del ROM di massima contrazione (braccio completamente disteso all'indietro) \u2014 un angolo che pushdown ed estensioni overhead non replicano con la stessa specificit\xE0.",errore:"Muovere il braccio superiore insieme all'avambraccio (come un colpo di remo): se l'omero si sposta, il movimento si trasforma in un'estensione di spalla assistita dal dorsale, perdendo l'isolamento del tricipite che \xE8 la ragione d'essere di questo esercizio."},tric_panca_stretta_bil:{setup:"Sdraiato su panca piana, bilanciere impugnato a presa stretta (circa larghezza spalle), gomiti che puntano verso i piedi.",esecuzione:"Discesa controllata verso la parte bassa dello sterno, gomiti vicini al busto, poi spinta in estensione. A differenza del Multipower, qui \xE8 richiesta stabilizzazione attiva del bilanciamento laterale della barra.",biomeccanica:"Stessa logica della variante Multipower (enfasi tricipite via presa stretta) ma con la richiesta aggiuntiva di stabilizzazione propriocettiva tipica del carico libero \u2014 il compound pi\xF9 completo per il tricipite in termini di reclutamento muscolare, a costo di una gestione della sicurezza pi\xF9 delicata vicino al cedimento.",errore:"Stesso della variante guidata (gomiti che si allargano), con l'aggravante che qui un cedimento improvviso della stabilit\xE0 laterale del bilanciere \xE8 un rischio reale \u2014 l'uso di un partner spotter o di safety bar \xE8 consigliato vicino al vero cedimento."},tric_panca_stretta_mp:{setup:"Sdraiato su panca piana sotto la barra del Multipower, presa stretta (circa larghezza spalle o poco meno), gomiti che puntano verso i piedi, non verso l'esterno.",esecuzione:"Discesa della barra verso la parte bassa dello sterno mantenendo i gomiti vicini al busto, poi spinta in estensione. La traiettoria fissa verticale del Multipower elimina la necessit\xE0 di stabilizzare il bilanciamento laterale.",biomeccanica:"La presa stretta sposta l'enfasi dal grande pettorale (dominante nella presa larga) verso il tricipite, che diventa il motore primario dell'estensione del gomito in questo compound \u2014 un ibrido tra esercizio di spinta per petto e per tricipite, con dominanza tricipite grazie alla presa ristretta.",errore:"Allargare troppo i gomiti durante la discesa: oltre a ridurre l'enfasi sul tricipite, aumenta lo stress sull'articolazione della spalla in una posizione di rotazione interna forzata."},tric_pushdown_barra:{setup:"Di fronte alla carrucola alta, barra dritta o a V agganciata, presa prona, gomiti bloccati ai fianchi.",esecuzione:"Estensione del gomito spingendo la barra verso il basso fino a braccia quasi completamente distese, poi ritorno controllato.",biomeccanica:"A differenza della corda, la barra rigida vincola la traiettoria del polso in un piano fisso \u2014 pi\xF9 semplice da controllare per chi inizia con questo movimento, ma senza il beneficio della separazione finale che la corda offre per l'accorciamento completo del muscolo.",errore:"Bloccare i gomiti con uno scatto secco a fine ripetizione: l'estensione completa va raggiunta con controllo, non con un blocco brusco dell'articolazione che scarica stress sull'olecrano."},tric_pushdown_corda:{setup:"Di fronte alla carrucola alta, corda agganciata, gomiti bloccati ai fianchi, leggera inclinazione del busto in avanti.",esecuzione:"Estensione del gomito spingendo la corda verso il basso, separando le due estremit\xE0 della corda alla fine del movimento per massimizzare l'accorciamento del tricipite.",biomeccanica:"La corda, a differenza della barra rigida, permette una leggera rotazione del polso e la separazione finale che i capi laterale e mediale del tricipite sfruttano per raggiungere un accorciamento pi\xF9 completo rispetto a un attrezzo con presa fissa.",errore:"Gomiti che si staccano dai fianchi e vanno in avanti: trasforma il movimento in una spinta con coinvolgimento di spalla e petto, diluendo lo stimolo specifico sul tricipite."},x1:{setup:"Su panca 45\xB0, bacino appoggiato sul cuscino con le anche libere di flettersi, caviglie bloccate sotto i rulli, busto che parte flesso in avanti verso il pavimento.",esecuzione:"Estensione del busto tramite contrazione degli erettori spinali e dei glutei, fino a portare la colonna in linea retta con le gambe \u2014 mai oltre, l'iperestensione della zona lombare oltre la neutralit\xE0 non \xE8 l'obiettivo e aumenta lo stress sui dischi intervertebrali.",biomeccanica:"Allena gli erettori spinali (il gruppo muscolare paravertebrale) in un movimento di estensione controllata dell'anca e della colonna \u2014 un gruppo cronicamente sotto-allenato rispetto agli addominali nella maggior parte dei programmi, nonostante il suo ruolo centrale nella stabilit\xE0 della colonna durante stacchi e squat.",errore:"Iperestendere oltre la linea retta arcuando vistosamente la parte bassa della schiena all'apice del movimento: l'obiettivo \xE8 tornare alla neutralit\xE0 della colonna, non superarla \u2014 l'iperestensione ripetuta sotto carico \xE8 una delle cause pi\xF9 comuni di fastidio lombare in questo esercizio."},x11:{setup:"In piedi di fianco alla carrucola bassa (dal lato opposto rispetto all'extra-rotazione), gomito a 90\xB0 contro il fianco, un asciugamano arrotolato sotto l'ascella per mantenere una leggera abduzione, maniglia impugnata con l'avambraccio che parte ruotato verso l'esterno.",esecuzione:"Ruota l'avambraccio verso l'interno portandolo davanti all'addome, gomito sempre fisso contro il fianco.",biomeccanica:"Allena gli intrarotatori (sottoscapolare principalmente), il complemento funzionale degli extrarotatori \u2014 un corretto bilanciamento di forza tra rotatori interni ed esterni (tipicamente un rapporto vicino a 3:2 a favore degli intrarotatori) \xE8 associato a una minore incidenza di infortuni alla cuffia.",errore:"Omettere l'asciugamano sotto l'ascella: senza quel distanziatore, il braccio tende ad addursi contro il fianco durante il movimento, riducendo il ROM reale della rotazione."},x12:{setup:"In piedi al centro tra due carrucole regolate all'altezza del petto, braccio destro che afferra la maniglia sinistra e viceversa (le braccia si incrociano davanti al corpo), gomiti con leggera flessione fissa.",esecuzione:"Apertura delle braccia verso l'esterno e leggermente indietro tramite abduzione orizzontale della spalla, scapole che si retraggono, poi ritorno controllato all'incrocio.",biomeccanica:"L'incrocio iniziale delle braccia aumenta il ROM disponibile per l'abduzione orizzontale rispetto a partire con le mani gi\xE0 ai lati, permettendo un maggiore allungamento del deltoide posteriore all'inizio del movimento \u2014 una variante del reverse fly con enfasi sull'allungamento iniziale.",errore:"Non incrociare abbastanza le braccia all'inizio: se la posizione di partenza non \xE8 visibilmente incrociata, si perde il vantaggio di ROM aggiuntivo che distingue questa variante da un normale reverse fly ai cavi."},x13:{setup:"Posizione di plank/push-up con braccia tese, mani leggermente pi\xF9 larghe delle spalle.",esecuzione:"Senza flettere i gomiti, spingi il busto verso l'alto tramite protrazione della scapola (le scapole si allontanano dalla colonna, la parte alta della schiena si arrotonda leggermente), poi ritorna controllando la retrazione.",biomeccanica:"Isola il dentato anteriore, muscolo spesso trascurato che stabilizza la scapola contro la gabbia toracica durante i movimenti di spinta \u2014 una sua debolezza \xE8 associata a scapola alata e ridotta efficienza in tutti gli esercizi di spinta per petto e spalle.",errore:"Flettere i gomiti durante il movimento: il 'plus' del push-up plus \xE8 specificamente il movimento scapolare aggiuntivo a braccia tese, se i gomiti si piegano diventa un push-up normale e il dentato anteriore non viene isolato."},x14:{setup:"Appoggio su avambracci e punte dei piedi, gomiti allineati sotto le spalle, corpo in linea retta da testa a talloni.",esecuzione:"Mantenimento della posizione tramite contrazione isometrica di tutto il core \u2014 addome, obliqui, lombari, glutei \u2014 per il tempo stabilito, senza cedimenti n\xE9 compensi.",biomeccanica:"A differenza degli esercizi dinamici, il plank allena la capacit\xE0 del core di resistere all'estensione lombare sotto carico gravitazionale (anti-estensione) \u2014 \xE8 la stessa funzione che il core svolge durante lo squat o lo stacco per proteggere la colonna, motivo per cui viene classificato come lavoro funzionale/di supporto piuttosto che di isolamento.",errore:"Bacino che cade verso il basso (iperestensione lombare) o si alza troppo (perdita della linea retta): entrambi indicano che il core ha ceduto e il carico si sta scaricando sulla colonna invece che sui muscoli addominali."},x2:{setup:"Sdraiato alla Leg Press orizzontale (stessa posizione della Calf Press ma con enfasi opposta), ginocchia distese, ma il movimento avviene con la punta del piede verso l'alto anzich\xE9 verso il basso.",esecuzione:"Dorsiflessione della caviglia tirando la punta del piede verso lo stinco contro la resistenza della pedana, poi ritorno controllato.",biomeccanica:"Allena il tibiale anteriore, il muscolo della parte anteriore della tibia responsabile della dorsiflessione \u2014 antagonista funzionale del tricipite surale (polpaccio), spesso completamente trascurato nei programmi di ipertrofia nonostante il suo ruolo nella prevenzione di squilibri di forza caviglia-correlati e nella stabilit\xE0 della camminata/corsa.",errore:"Ignorare questo esercizio considerandolo superfluo: uno squilibrio marcato tra la forza del polpaccio (plantarflessori) e quella del tibiale anteriore (dorsiflessori) \xE8 un fattore di rischio documentato per infortuni alla caviglia e alla tibia (periostite) in chi corre o pratica sport con cambi di direzione."},x3:{setup:"In piedi sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle, braccia completamente distese, bilanciere all'altezza del bacino.",esecuzione:"Solleva le spalle verso le orecchie in un movimento verticale puro, senza rotazione \u2014 la traiettoria del Multipower elimina comunque la tentazione di 'rotolare' le spalle, mantenendo il movimento pulito. Pausa di un istante alla massima contrazione, poi discesa controllata.",biomeccanica:"Isola il trapezio superiore, la cui azione primaria \xE8 elevare la scapola \u2014 la traiettoria verticale fissa del Multipower \xE8 particolarmente indicata qui perch\xE9 elimina il rischio (presente col bilanciere libero) di oscillare in avanti/indietro cercando di compensare lo sbilanciamento del carico.",errore:"Flettere i gomiti per 'aiutare' il sollevamento: le braccia devono restare completamente passive e distese, il movimento \xE8 esclusivamente un'elevazione scapolare \u2014 se i gomiti si piegano, i bicipiti stanno rubando lavoro al trapezio."},x15:{setup:"Prono su panca inclinata 30-45\xB0, petto appoggiato al cuscino, manubri leggeri in mano, braccia tese verso il basso a inizio movimento.",esecuzione:`Sollevamento delle braccia disegnando una "Y" \u2014 non lateralmente come nelle alzate posteriori, ma diagonalmente verso l'alto, pollici che ruotano verso l'esterno a fine corsa, scapole che si retraggono e si abbassano insieme, poi discesa controllata.`,biomeccanica:"A differenza delle Scrollate (che elevano la scapola, isolando il trapezio superiore), il movimento a Y allena specificamente il trapezio medio e inferiore nella loro funzione di retrazione e depressione scapolare \u2014 il fascio che stabilizza la scapola durante i movimenti overhead e che, se debole, contribuisce alla postura con spalle arrotolate in avanti. Il carico resta volutamente leggero: \xE8 un lavoro di controllo motorio e resistenza posturale, non di forza massimale.",errore:"Usare manubri troppo pesanti che costringono a sostituire il movimento con uno slancio del busto o un'elevazione delle spalle verso le orecchie (trapezio superiore che compensa): il trapezio medio/basso \xE8 intrinsecamente debole rispetto al superiore, il carico va tenuto leggero per isolarlo davvero."},x16:{setup:"Sdraiato supino su panca, testa oltre il bordo, piccolo disco tenuto con entrambe le mani appoggiato sulla fronte.",esecuzione:"Flessione del collo sollevando la testa in avanti contro la resistenza del disco, poi ritorno controllato fino a un leggero allungamento all'indietro (senza forzare l'estensione).",biomeccanica:"Allena i flessori profondi e superficiali del collo (lungo del collo, scaleni, sternocleidomastoideo), muscoli quasi sempre assenti dai programmi di ipertrofia standard nonostante il loro ruolo nella stabilit\xE0 cervicale \u2014 rilevante per chi pratica sport da contatto, ma utile anche solo per bilanciare la postura in chi passa molte ore con la testa proiettata in avanti (uso prolungato di schermi).",errore:"Usare un carico eccessivo o un ROM ampio fin da subito: il collo \xE8 un distretto delicato con muscoli piccoli \u2014 si parte con dischi molto leggeri (1-2.5kg) e ROM ridotto, aumentando gradualmente nel tempo."},x17:{setup:"Prono su panca, testa oltre il bordo, piccolo disco tenuto con entrambe le mani appoggiato sulla nuca (o cinghia dedicata se disponibile).",esecuzione:"Estensione del collo sollevando la testa all'indietro contro la resistenza del disco, poi ritorno controllato fino a un leggero allungamento in avanti (senza forzare la flessione).",biomeccanica:"Allena gli estensori del collo (splenio, semispinale, trapezio superiore in parte), il gruppo opposto e complementare ai flessori \u2014 un buon equilibrio di forza tra flessori ed estensori del collo riduce il rischio di infortunio cervicale negli sport di contatto ed \xE8 protettivo per la postura generale del tratto cervicale.",errore:"Stesso principio della flessione: carico e ROM minimi all'inizio, progressione molto pi\xF9 lenta rispetto ai grandi gruppi muscolari \u2014 il collo tollera meno stress improvviso di quanto suggerisca la sua apparente resistenza quotidiana."},x5:{setup:"In piedi di fronte alla carrucola alta, corda agganciata, braccia tese in avanti all'altezza del viso.",esecuzione:"Trazione della corda verso il viso separando le due estremit\xE0, gomiti che si alzano lateralmente sopra il livello delle spalle, con leggera extra-rotazione della spalla nella fase finale.",biomeccanica:"Esercizio ibrido che allena simultaneamente il deltoide posteriore, il trapezio medio/inferiore, i romboidi e gli extrarotatori della cuffia \u2014 spesso considerato un esercizio 'correttivo' per contrastare la postura con spalle protratte in avanti tipica di chi allena molto le spinte per petto.",errore:"Tirare la corda verso il petto invece che verso il viso, con i gomiti bassi: cambia completamente l'enfasi muscolare, trasformandolo in una via di mezzo tra un rematore e un'alzata posteriore, perdendo la specificit\xE0 sulla cuffia e sul trapezio medio."},x7:{setup:"In piedi di fianco alla carrucola bassa, gomito piegato a 90\xB0 e bloccato contro il fianco, avambraccio parallelo al terreno davanti al corpo, maniglia impugnata.",esecuzione:"Ruota l'avambraccio verso l'esterno (extra-rotazione della spalla) mantenendo il gomito fisso contro il fianco per tutto il movimento \u2014 solo l'articolazione della spalla ruota, non il gomito n\xE9 il busto.",biomeccanica:"Allena gli extrarotatori della cuffia (sovraspinato, infraspinato, piccolo rotondo), muscoli piccoli che stabilizzano la testa dell'omero nella glena durante ogni movimento di spinta e trazione sopra la testa \u2014 un deficit di forza in extra-rotazione \xE8 uno dei fattori di rischio pi\xF9 documentati per il conflitto sub-acromiale.",errore:"Staccare il gomito dal fianco per aumentare il ROM apparente: il movimento deve avvenire esclusivamente per rotazione dell'omero nella sua sede articolare, non per spostamento del braccio nello spazio."},x8:{setup:"In piedi di fronte alla carrucola alta, doppia maniglia o barra impugnata, braccia tese in avanti all'altezza delle spalle.",esecuzione:"Senza flettere i gomiti, retrai le scapole tirandole verso la colonna e leggermente verso il basso, poi ritorna controllando la protrazione. Il movimento delle braccia nello spazio \xE8 minimo \u2014 il lavoro \xE8 quasi interamente scapolare.",biomeccanica:"Isola i romboidi e il trapezio medio-inferiore, i muscoli che retraggono e stabilizzano la scapola in postura corretta \u2014 spesso deboli rispetto al grande pettorale e al gran dorsale nella popolazione che si allena prevalentemente su panca e lat machine, contribuendo alla postura con spalle protratte in avanti.",errore:"Usare i bicipiti per tirare (flettendo i gomiti): il movimento corretto avviene interamente nella scapola, le braccia restano quasi rigide \u2014 se i gomiti si piegano visibilmente, il dentato/romboidi stanno perdendo il lavoro a favore dei flessori del gomito."}},U=Jx.map(mS),yr=["Bilanciere","Manubri","Cavi","Macchina","Multipower","Panatta","Panca","Corpo Libero"],Ir=null;function hS(e){Ir=Array.isArray(e)&&e.length>0?new Set(e):null}function vS(e){return!Ir||Ir.has(e)}function Ri(e,{onlyHdRecommended:a,onlyZtRecommended:t,zone:o,ignoreEquipmentFilter:l}={}){let i=U.filter(u=>!(u.group!==e||u.complementare||o&&u.zone!==o||a&&!u.hdRecommended||t&&!u.ztRecommended));if(l||!Ir)return i;let r=i.filter(u=>vS(u.equipment));return r.length>0?r:i}var bS={Petto:["pett_chest_press","pett_dist_piana_mp","pett_dist_incl_mp"],Schiena:["schi_lat_machine","schi_rematore_2man_incl","schi_rematore_busto_flesso_mp"],Gambe:["gamb_squat_mp","gamb_leg_press_45","gamb_leg_press_orizz","gamb_power_squat"]};function _r(e,a){return e.length?e.find(o=>a&&a.includes(o.id))||e[0]:null}funct
