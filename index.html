  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
  .font-ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .font-num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: #C8C8CA; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  select { background: transparent; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Stampa A4 \u2014 l'area #print-area \xE8 invisibile a schermo, mostrata solo dal dialogo di stampa
     nativo del browser (window.print()). Non usa librerie esterne: testo vettoriale nitido,
     "Salva come PDF" \xE8 un'opzione di serie in qualsiasi browser mobile/desktop. */
  @media screen {
    #print-area { display: none; }
  }
  @media print {
    html, body { height: auto !important; overflow: visible !important; }
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    @page { size: A4; margin: 1.5cm; }
    .print-split { break-before: page; }
    .print-split:first-child { break-before: auto; }
    /* Forza la stampa dei colori di sfondo (badge HD/ZT, card) \u2014 i browser li scartano di
       default per risparmiare inchiostro, ma qui servono per riconoscere HD/ZT a colpo d'occhio. */
    #print-area, #print-area * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
