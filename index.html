  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
  .font-ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .font-num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: #41463D; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  select { background: transparent; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  /* Revisione 27/09/2026: index.html applica "input{-webkit-appearance:none}" a tutti gli input,
     che rendeva le caselle di spunta larghe 0px \u2014 invisibili (es. "Arrivo al cedimento vero",
     isometria di picco). Ripristinate, col rosso HD della palette. */
  input[type=checkbox] { -webkit-appearance: checkbox !important; appearance: auto !important; width: 18px; height: 18px; min-width: 18px; accent-color: #C6F432; cursor: pointer; }

  /* \u2500\u2500 Redesign 26/09/2026 \u2014 SOLO aspetto: nessuna regola qui cambia logica o flussi. \u2500\u2500 */
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  ::selection { background: #C6F432; color: #0C0D0C; }

  /* Leggibilit\xE0: i testi da 8-10px erano sotto la soglia di lettura comoda su telefono.
     Alzati di 1-2px ovunque senza toccare i componenti uno per uno. */
  .font-ui .text-\\[8px\\]  { font-size: 10px;   line-height: 1.35; }
  .font-ui .text-\\[9px\\]  { font-size: 10.5px; line-height: 1.4; }
  .font-ui .text-\\[10px\\] { font-size: 11px; }

  /* Feedback al tocco: ogni pulsante "risponde" (leggera pressione) e le transizioni di colore
     sono morbide invece che a scatto. */
  button { transition: transform .12s ease, background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease, opacity .18s ease; }
  button:not(:disabled):active { transform: scale(0.97); }
  button:disabled { cursor: not-allowed; }

  /* Focus visibile (tastiera/accessibilit\xE0) e stato attivo dei campi */
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #C6F432; outline-offset: 2px; }
  input, textarea, select { transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(198,244,50,.22); }

  /* I menu a tendina avevano l'aspetto nativo disattivato e nessuna freccia: non si capiva che

tante sull'addome durante tutto il ROM, incluso il ritorno controllato \u2014 il peso del corpo da solo perde tensione nella parte alta del movimento dove il braccio di leva \xE8 pi\xF9 corto.",errore:"Tirare con le braccia/spalle invece di flettere il busto: se senti fatica al collo o ai bicipiti invece che all'addome, il movimento sta partendo dal posto sbagliato."},addo_crunch_panca_disco:{setup:"Sdraiato su panca piana o leggermente declinata, disco tenuto al petto con entrambe le mani, ginocchia flesse a piedi appoggiati.",esecuzione:"Flessione del busto sollevando le scapole da terra attraverso la contrazione del retto addominale, non tramite trazione delle mani sul disco. Range di movimento breve e controllato \u2014 il retto addominale si accorcia di pochi centimetri, un ROM enorme indica che sta intervenendo il flessore dell'anca.",biomeccanica:"Il disco sul petto sposta il baricentro del carico pi\xF9 lontano dal punto di rotazione (l'ombelico), aumentando il braccio di leva resistente rispetto al crunch a mani vuote \u2014 permette di sovraccaricare progressivamente un movimento che altrimenti diventa presto troppo facile.",errore:"Sollevare l'intero busto fino a seduto: oltre i primi 30-45\xB0 il lavoro passa dal retto addominale all'ileopsoas (flessore dell'anca) \u2014 il crunch si ferma dove finisce la flessione della colonna, non dove inizia quella dell'anca."},addo_side_bend_cavi:{setup:"In piedi di fianco alla carrucola bassa, maniglia tenuta con la mano pi\xF9 lontana dalla macchina, altra mano libera o dietro la testa. Piedi larghezza spalle per stabilit\xE0.",esecuzione:"Flessione laterale del busto verso il basso in direzione della carrucola, poi risalita contraendo l'obliquo del lato opposto fino alla verticale (senza superarla in iperestensione laterale).",biomeccanica:"Il cavo mantiene una resistenza orizzontale costante mentre il busto si muove nel piano frontale \u2014 a differenza del manubrio (dove la resistenza \xE8 sempre verticale per gravit\xE0), il cavo carica l'obliquo in modo pi\xF9 uniforme lungo tutto il ROM.",errore:"Flettere anche le anche insieme al busto (piegarsi tutto di lato dalle caviglie): il movimento deve avvenire nella colonna, con bacino e gambe stabili \u2014 altrimenti diventa un esercizio per la catena laterale della gamba, non per gli obliqui."},addo_side_bend_man:{setup:"In piedi, un manubrio tenuto con un solo braccio lungo il fianco, altra mano libera o sul fianco opposto per percepire la contrazione.",esecuzione:"Flessione laterale del busto verso il lato del manubrio (il peso scende lungo la gamba), poi risalita contraendo l'obliquo del lato senza manubrio fino alla posizione neutra.",biomeccanica:"Qui il manubrio crea resistenza nella fase di allungamento (discesa) e nella risalita l'obliquo controlaterale lavora contro un braccio di leva che si accorcia progressivamente \u2014 meno efficiente del cavo per il carico costante, ma pi\xF9 accessibile senza attrezzatura dedicata.",errore:"Superare la verticale nella risalita inclinandosi dal lato opposto: aggiunge ROM ma senza reale beneficio, e sposta stress sulla colonna lombare in una posizione di leva sfavorevole."},addo_side_crunch_decl:{setup:"Sdraiato di fianco su panca declinata, gambe bloccate sotto i rulli, disco tenuto al petto o dietro la testa.",esecuzione:"Flessione laterale del busto, avvicinando la gabbia toracica al bacino sul lato di lavoro. Il movimento \xE8 breve \u2014 pochi centimetri di accorciamento reale dell'obliquo, non una torsione ampia.",biomeccanica:"L'obliquo esterno/interno lavora in flessione laterale pura qui, isolato dalla componente rotazionale che interviene in molti esercizi addominali \u2014 utile per chi vuole allenare specificamente la flessione laterale senza la rotazione del busto.",errore:"Usare la gravit\xE0 e cadere lateralmente invece di controllare la fase eccentrica: la discesa controllata \xE8 dove il muscolo lavora eccentricamente sotto tensione, ometterla dimezza lo stimolo."},addo_sollev_bacino_panca:{setup:"Sdraiato su panca piana, mani agganciate al bordo dietro la testa per stabilit\xE0, gambe tese o leggermente flesse verso l'alto.",esecuzione:"Solleva il bacino verso il petto arrotolando la parte bassa della colonna, non calciando le gambe verso l'alto per inerzia. Il movimento utile \xE8 la retroversione pelvica seguita dal sollevamento dei glutei da terra di pochi centimetri.",biomeccanica:"Questo \xE8 l'esercizio complementare specifico per il retto addominale basso \u2014 la porzione inferiore del muscolo si accorcia elevando il bacino verso la gabbia toracica, movimento che il crunch classico (che muove il torace verso il bacino) non allena in modo specifico.",errore:"Usare lo slancio delle gambe per generare il movimento: se senti tensione nella zona lombare invece che nell'addome basso, stai oscillando invece di sollevare controllando."},addo_sollev_bacino_sbarra:{setup:"Appeso alla barra a presa prona, leggermente pi\xF9 larga delle spalle, corpo disteso o con ginocchia flesse a 90\xB0 come punto di partenza.",esecuzione:"Solleva il bacino verso la gabbia toracica tramite retroversione pelvica controllata, evitando lo slancio a pendolo che scarica il lavoro sui flessori dell'anca e sul dorsale (usato per stabilizzare il corpo appeso).",biomeccanica:"La sospensione libera elimina qualsiasi punto d'appoggio, richiedendo un controllo del core molto superiore alla variante su panca \u2014 anche la sola stabilizzazione del corpo appeso (evitare l'oscillazione) \xE8 un lavoro isometrico aggiuntivo per l'intero core.",errore:"Iniziare il movimento flettendo le ginocchia verso il petto anzich\xE9 ruotando il bacino: le ginocchia che salgono senza retroversione pelvica allenano principalmente l'ileopsoas, non il retto addominale."},addo_torsioni_man:{setup:"Seduto a terra o su una panca bassa, busto inclinato indietro a circa 45\xB0, ginocchia flesse e piedi sollevati da terra per aumentare la difficolt\xE0, manubrio tenuto con entrambe le mani davanti al petto.",esecuzione:"Rotazione del busto da un lato all'altro, toccando idealmente il manubrio a terra ai lati del bacino, mantenendo la tensione addominale costante e il busto stabile nell'inclinazione di partenza.",biomeccanica:"Movimento di rotazione pura del tronco: gli obliqui interni ed esterni lavorano in coppia crociata (obliquo esterno di un lato + obliquo interno del lato opposto) per generare la rotazione \u2014 un pattern di reclutamento diverso dalla flessione laterale del side bend.",errore:"Muovere solo le braccia mantenendo il busto fisso: la rotazione deve avvenire nella colonna toracica/lombare, non nelle spalle \u2014 se il manubrio si sposta ma l'ombelico punta sempre avanti, l'addome non sta lavorando."},bici_alternate_three_angles:{setup:"Seduto alla macchina Panatta dedicata, braccia posizionate secondo l'angolazione scelta (la macchina offre tipicamente 2-3 angoli di lavoro diversi per lo stesso movimento).",esecuzione:"Flessione del gomito lungo il percorso guidato, con la possibilit\xE0 di alternare l'angolo di lavoro tra le serie per variare l'enfasi tra i capi del bicipite.",biomeccanica:"Angolazioni diverse dell'omero rispetto al busto modificano la lunghezza relativa (e quindi il contributo) del capo lungo vs capo breve del bicipite \u2014 una macchina che offre pi\xF9 angoli permette di allenare selettivamente porzioni diverse del muscolo nella stessa sessione.",errore:"Usare sempre lo stesso angolo per abitudine: il vantaggio specifico di questa macchina \xE8 la variabilit\xE0 angolare \u2014 non sfruttarla significa avere lo stesso stimolo di una macchina curl standard."},bici_bayesian_curl:{setup:"In piedi, di spalle alla carrucola bassa, un passo in avanti rispetto alla macchina, braccio esteso indietro dietro la linea del busto, maniglia impugnata.",esecuzione:"Flessione del gomito partendo da una posizione di estensione della spalla ancora pi\xF9 marcata del curl su panca inclinata \u2014 il cavo, tirando da dietro, mantiene tensione anche in questa posizione estrema che un manubrio (soggetto solo alla gravit\xE0 verticale) non potrebbe caricare efficacemente.",biomeccanica:"Questa \xE8 la configurazione che allunga di pi\xF9 il capo lungo del bicipite tra tutte le varianti disponibili \u2014 la combinazione di estensione della spalla e tensione costante del cavo crea lo stimolo di allungamento sotto carico pi\xF9 marcato per questo muscolo.",errore:"Non arretrare abbastanza il braccio all'inizio: se la posizione di partenza non \xE8 visibilmente dietro la linea del busto, si perde il vantaggio specifico rispetto a un curl al cavo basso normale."},bici_curl_alt_man:{setup:"In piedi o seduto, un manubrio per mano, presa neutra (palmi verso il corpo) a inizio movimento.",esecuzione:"Flessione del gomito con supinazione progressiva dell'avambraccio (il palmo ruota verso l'alto durante la salita) \u2014 alternando i due bracci o simultaneamente secondo variante.",biomeccanica:"La supinazione durante il movimento aggiunge il lavoro del bicipite come supinatore dell'avambraccio (una delle sue due funzioni, oltre alla flessione del gomito) rispetto a un curl a presa fissa \u2014 recluta il capo lungo del bicipite in modo pi\xF9 completo.",errore:"Ruotare la spalla insieme all'avambraccio per 'aiutare' la supinazione: la rotazione deve avvenire solo nell'articolazione radio-ulnare del polso/avambraccio, non nella spalla."},bici_curl_bilanciere_ez:{setup:"In piedi, presa prona sulla barra EZ nella parte angolata (polso in posizione neutra-semiprona, meno stress sull'articolazione rispetto alla barra dritta), gomiti vicini ai fianchi.",esecuzione:"Flessione del gomito sollevando la barra mantenendo i gomiti fermi lungo il fianco \u2014 non devono spostarsi in avanti (che accorcia il ROM e coinvolge il deltoide anteriore) n\xE9 indietro.",biomeccanica:"La curvatura della barra EZ colloca il polso in un angolo intermedio tra pronazione e supinazione, riducendo il torque rotazionale sull'articolazione del polso rispetto alla barra dritta, a fronte di una riduzione minima dell'attivazione del capo lungo del bicipite.",errore:"Usare lo slancio del busto (arcuare la schiena, spingere le anche in avanti) per completare la ripetizione quando il carico \xE8 pesante: il momento generato dal tronco toglie lavoro al bicipite proprio nel punto in cui l'esercizio dovrebbe essere pi\xF9 difficile."},bici_curl_cavi_larga:{setup:"In piedi di fronte alla carrucola bassa, barra dritta o EZ agganciata, presa poco pi\xF9 larga delle spalle, gomiti ai fianchi.",esecuzione:"Flessione del gomito come nel curl con bilanciere, ma con tensione costante generata dal cavo per tutto il ROM, incluso il punto di massima estensione dove il bilanciere libero perde quasi completamente il carico.",biomeccanica:"Nel curl con bilanciere il braccio di leva resistente si annulla quando il braccio \xE8 completamente disteso (il peso \xE8 verticale sotto il gomito) \u2014 col cavo, l'angolazione della carrucola mantiene una componente di resistenza anche a braccio teso, allungando il tempo sotto tensione reale.",errore:"Allontanarsi troppo dalla colonna del cavo o avvicinarsi eccessivamente: l'angolo del cavo rispetto al braccio determina dove si concentra il carico nel ROM \u2014 sperimentare la distanza per trovare dove la tensione \xE8 pi\xF9 costante."},bici_curl_cavo_prona:{setup:"Di fronte alla carrucola bassa, barra dritta agganciata, presa prona (palmi verso il basso).",esecuzione:"Flessione del gomito mantenendo la presa prona fissa \u2014 equivalente al reverse curl con bilanciere ma con la tensione costante tipica del cavo.",biomeccanica:"Come il reverse curl, enfatizza brachioradiale ed estensori del polso pi\xF9 che il bicipite propriamente detto; il cavo aggiunge tensione anche nella fase di massima estensione del braccio, dove il bilanciere libero la perde quasi completamente.",errore:"Usare un peso pari o superiore al curl standard: la presa prona \xE8 meccanicamente pi\xF9 debole, forzare il carico porta quasi sempre a flettere il polso durante il movimento invece di mantenerlo fisso."},bici_curl_concentrato:{setup:"Seduto sul bordo di una panca, gomito appoggiato all'interno della coscia dello stesso lato, busto leggermente inclinato in avanti, manubrio in mano a braccio disteso.",esecuzione:"Flessione del gomito in isolamento quasi totale, l'appoggio sulla coscia blocca completamente l'omero. Nella fase finale, ruota leggermente il polso in supinazione per massimizzare la contrazione di picco.",biomeccanica:"L'appoggio del gomito sulla coscia \xE8 il vincolo meccanico pi\xF9 stabile tra tutti i curl con manubri \u2014 nessun altro esercizio per bicipite offre lo stesso isolamento articolare completo, rendendolo ideale per il lavoro di rifinitura e la connessione mente-muscolo.",errore:"Sollevare la spalla o inclinare il busto durante la risalita per generare slancio: con l'omero bloccato dall'appoggio, qualsiasi assistenza deve necessariamente venire dalla parte alta del corpo \u2014 se noti il busto muoversi, il carico \xE8 eccessivo."},bici_curl_incl_man:{setup:"Sdraiato su panca inclinata a 45-60\xB0, braccia che pendono liberamente lungo i lati del corpo, manubri in mano a presa neutra o supina.",esecuzione:"Flessione del gomito partendo da una posizione di braccio esteso dietro la linea del busto (per via dell'inclinazione della panca) \u2014 il bicipite parte gi\xE0 in allungamento rispetto al curl in piedi.",biomeccanica:"L'inclinazione della panca pone la spalla in leggera estensione, allungando il capo lungo del bicipite (che origina sulla scapola, sopra la testa dell'omero) all'inizio del movimento \u2014 l'allungamento sotto carico \xE8 uno degli stimoli meccanici pi\xF9 efficaci per l'ipertrofia secondo la letteratura recente su stretch-mediated hypertrophy.",errore:"Portare i gomiti in avanti durante la risalita per facilitare il movimento: annulla l'allungamento iniziale che \xE8 la ragione principale per usare questa variante rispetto al curl in piedi."},bici_curl_machine:{setup:"Seduto, petto/braccia appoggiati sul supporto imbottito della macchina, presa sulle maniglie secondo il design specifico.",esecuzione:"Flessione del gomito lungo la traiettoria fissa della macchina \u2014 il percorso \xE8 vincolato meccanicamente, rendendo impossibile qualsiasi compenso.",biomeccanica:"Il vincolo meccanico della macchina garantisce una curva di resistenza spesso variabile (pi\xF9 carico percepito a met\xE0 ROM dove la leva del bicipite \xE8 pi\xF9 sfavorevole) progettata per adattarsi alla curva di forza naturale del muscolo \u2014 un vantaggio specifico delle macchine a camma rispetto ai pesi liberi.",errore:"Regolare male l'altezza del sedile: se l'asse di rotazione del gomito non coincide con quello della macchina, il movimento genera attrito e stress articolare invece di un ROM pulito."},bici_curl_reverse:{setup:"In piedi, bilanciere impugnato a presa prona (palmi verso il basso), gomiti ai fianchi.",esecuzione:"Flessione del gomito mantenendo la presa prona per tutto il movimento \u2014 il polso non ruota, a differenza del curl classico.",biomeccanica:"La presa prona pone il brachioradiale e gli estensori del polso in posizione biomeccanicamente vantaggiosa, riducendo drasticamente il contributo del capo lungo/breve del bicipite \u2014 \xE8 pi\xF9 un esercizio per l'avambraccio esterno e il brachiale che per il bicipite propriamente detto.",errore:"Usare carichi comparabili al curl classico: la presa prona \xE8 intrinsecamente pi\xF9 debole (i muscoli coinvolti hanno minore capacit\xE0 di forza in questa configurazione), un carico eccessivo forza compensazioni con la spalla."},bici_curl_scott_cavo:{setup:"Seduto o in piedi alla panca Scott, braccia appoggiate sul cuscino inclinato, presa sulla barra collegata al cavo basso.",esecuzione:"Flessione del gomito con l'omero bloccato dall'appoggio della panca \u2014 impossibile compensare con la spalla, a differenza del curl in piedi.",biomeccanica:"L'appoggio fisso dell'omero elimina qualsiasi contributo della spalla e del tronco, isolando il bicipite in modo quasi assoluto; l'angolo della panca Scott (tipicamente 45-60\xB0) pone inoltre il bicipite in allungamento already all'inizio del movimento, aumentando lo stimolo nella porzione iniziale del ROM.",errore:"Sollevare i gomiti dal cuscino nella fase finale della risalita: \xE8 il modo pi\xF9 comune di 'barare' su questo esercizio quando il carico \xE8 vicino al cedimento \u2014 se i gomiti si staccano, la serie \xE8 di fatto conclusa."},bici_curl_unilat_maniglia:{setup:"In piedi di fianco alla carrucola bassa, maniglia singola impugnata con presa neutra o supina, corpo leggermente ruotato rispetto al cavo.",esecuzione:"Flessione del gomito con tensione costante dal cavo, permettendo un focus unilaterale completo su un braccio alla volta \u2014 utile per correggere asimmetrie di forza tra i due lati.",biomeccanica:"L'esecuzione unilaterale elimina la possibilit\xE0 che il braccio pi\xF9 forte compensi per quello pi\xF9 debole (cosa che accade inevitabilmente con bilanciere o manubri bilaterali), rendendo visibile e allenabile ogni asimmetria reale.",errore:"Ruotare il busto per generare slancio nella fase concentrica: la rotazione del tronco aggiunge un contributo esterno che maschera la reale capacit\xE0 del bicipite."},bici_hammer_curl:{setup:"In piedi o seduto, manubri con presa neutra mantenuta fissa per tutto il movimento (a differenza del curl alternato, qui il palmo resta sempre rivolto verso il corpo).",esecuzione:"Flessione del gomito mantenendo il polso in posizione neutra costante, gomiti fermi ai fianchi.",biomeccanica:"La presa neutra sposta parte del lavoro dal capo breve del bicipite verso il brachiale e il brachioradiale \u2014 muscoli che contribuiscono allo spessore del braccio visto di lato ma sono poco reclutati nel curl a presa supina classico.",errore:"Lasciare che il polso ruoti verso la supinazione durante la risalita: se il movimento assomiglia a un curl alternato invece che restare rigidamente neutro, si perde l'enfasi specifica sul brachiale/brachioradiale che \xE8 la ragione d'essere di questa variante."},bici_hammer_curl_corda:{setup:"Di fronte alla carrucola bassa con corda agganciata, presa neutra su entrambe le estremit\xE0 della corda, gomiti ai fianchi.",esecuzione:"Flessione del gomito a presa neutra fissa, le due estremit\xE0 della corda restano parallele per tutto il movimento (non si separano come nel pushdown tricipiti).",biomeccanica:"Stessa logica dell'hammer curl con manubri (enfasi su brachiale/brachioradiale via presa neutra) ma con tensione costante del cavo anzich\xE9 variabile per gravit\xE0 \u2014 combina i due vantaggi in un solo esercizio.",errore:"Lasciare che i gomiti si allontanino dal busto quando il carico aumenta: aumenta il braccio di leva in modo scorretto e riduce il controllo sulla traiettoria."},bici_high_cable_curl:{setup:"In piedi tra due carrucole alte (o una sola, secondo l'attrezzatura), braccia estese lateralmente all'altezza delle spalle, gomiti leggermente flessi, maniglie impugnate.",esecuzione:"Flessione del gomito portando le mani verso la testa mantenendo il braccio (omero) fermo nel piano orizzontale \u2014 il movimento avviene solo all'articolazione del gomito, non della spalla.",biomeccanica:"Con il braccio orizzontale e sopra il livello del cuore, il capo lungo del bicipite si trova in una posizione di massimo allungamento all'origine (sulla scapola) mentre lavora \u2014 una angolazione che nessun curl tradizionale (dove il braccio \xE8 lungo il fianco) replica.",errore:"Flettere la spalla portando i gomiti in avanti durante la risalita: il braccio deve restare fisso nel piano frontale, il movimento \xE8 isolato al gomito."},bici_incline_hammer:{setup:"Stessa posizione del curl inclinato, ma con presa neutra mantenuta fissa per tutto il movimento.",esecuzione:"Flessione del gomito a presa neutra, braccio che parte in leggera estensione dietro la linea del busto per via dell'inclinazione della panca.",biomeccanica:"Combina l'allungamento del capo lungo del bicipite (dato dall'inclinazione della panca) con l'enfasi su brachiale/brachioradiale (data dalla presa neutra) \u2014 una delle configurazioni pi\xF9 complete per lo spessore del braccio in un singolo esercizio.",errore:"Stesso della versione supina: portare i gomiti avanti annulla il vantaggio meccanico specifico di questa variante."},bici_wrist_curl:{setup:"Seduto, avambracci appoggiati sulle cosce o su una panca con i polsi liberi oltre il bordo, presa prona rovesciata (palmi verso l'alto), bilanciere o manubri in mano.",esecuzione:"Flessione del polso sollevando il carico verso l'avambraccio, mantenendo l'avambraccio completamente fermo e appoggiato \u2014 il movimento avviene solo nell'articolazione del polso.",biomeccanica:"Isola i flessori del carpo e delle dita (flessore radiale/ulnare del carpo, flessore superficiale delle dita), muscoli che nel resto dell'allenamento lavorano quasi solo in modo isometrico come stabilizzatori di presa \u2014 qui lavorano attraverso l'intero ROM articolare.",errore:"Compensare con l'avambraccio che si solleva dall'appoggio: se il gomito si muove, il lavoro si sposta sul bicipite e l'isolamento del polso si perde."},bici_wrist_curl_inv:{setup:"Stessa posizione del wrist curl standard, ma presa prona (palmi verso il basso) \u2014 \xE8 la variante che allena il movimento opposto.",esecuzione:"Estensione del polso sollevando il dorso della mano verso l'alto contro la resistenza, avambraccio fermo sull'appoggio.",biomeccanica:"Allena gli estensori del carpo, muscoli tipicamente pi\xF9 deboli e meno allenati dei flessori (che lavorano di pi\xF9 nella presa quotidiana e in palestra) \u2014 uno squilibrio flessori/estensori del polso \xE8 un fattore di rischio comune per l'epicondilite laterale (gomito del tennista).",errore:"Usare un carico eccessivo che costringe a flettere il gomito per aiutare il sollevamento: gli estensori del polso sono intrinsecamente pi\xF9 deboli dei flessori, il carico va ridotto rispetto al wrist curl standard, non uguagliato."},gamb_abductor:{setup:"Seduto alla macchina, gambe posizionate contro i cuscini laterali, iniziando con le ginocchia unite o vicine.",esecuzione:"Apertura delle gambe verso l'esterno tramite abduzione dell'anca, contrazione di picco a fine movimento, poi ritorno controllato.",biomeccanica:"Allena il medio e piccolo gluteo (abduttori dell'anca), muscoli fondamentali per la stabilit\xE0 laterale del bacino durante la camminata e lo squat monopodalico \u2014 spesso trascurati nonostante il loro ruolo nella prevenzione del valgismo dinamico del ginocchio.",errore:"Usare un ROM eccessivo inclinando il bacino: il movimento deve avvenire nell'articolazione dell'anca con bacino stabile, non tramite rotazione compensatoria del tronco."},gamb_adductor:{setup:"Seduto alla macchina, gambe posizionate contro i cuscini laterali, iniziando con le ginocchia aperte.",esecuzione:"Chiusura delle gambe verso il centro tramite adduzione dell'anca, contrazione di picco a fine movimento, poi ritorno controllato all'apertura.",biomeccanica:"Allena gli adduttori della coscia (adduttore lungo, breve, grande, gracile), gruppo muscolare spesso trascurato ma con un ruolo importante nella stabilizzazione del ginocchio durante movimenti di taglio laterale e nella componente di forza in molti pattern di squat/affondo.",errore:"Range di movimento eccessivamente ampio con carico alto: gli adduttori sono un gruppo relativamente piccolo, un carico eccessivo forzato su un ROM ampio aumenta il rischio di stiramento senza beneficio ipertrofico proporzionale."},gamb_affondi_inversi_mp:{setup:"In piedi sotto la barra del Multipower, bilanciere sui trapezi, un piede che compie un passo indietro fino a formare un angolo di circa 90\xB0 al ginocchio anteriore.",esecuzione:"Discesa controllata con il ginocchio posteriore che si avvicina al pavimento, poi risalita spingendo principalmente attraverso la gamba anteriore per tornare alla posizione di partenza.",biomeccanica:"Il passo indietro (anzich\xE9 in avanti) riduce lo stress di taglio anteriore sul ginocchio della gamba di lavoro rispetto all'affondo in avanti, rendendolo generalmente una variante pi\xF9 indicata per chi ha sensibilit\xE0 al ginocchio anteriore \u2014 la guida verticale del Multipower elimina inoltre il compito di bilanciamento laterale del bilanciere libero.",errore:"Spingere troppo con la gamba posteriore (quella che arretra) invece che con quella anteriore: la gamba di lavoro primaria deve essere quella anteriore, che resta a contatto pieno con il pavimento per l'intero movimento."},gamb_affondi_manubri:{setup:"In piedi, manubri tenuti lungo i fianchi, un piede che compie un passo in avanti (o indietro, secondo variante) fino a formare due angoli di circa 90\xB0 alle ginocchia nella posizione finale.",esecuzione:"Discesa controllata flettendo entrambe le ginocchia, il ginocchio posteriore che si avvicina al pavimento senza toccarlo, poi risalita spingendo principalmente attraverso la gamba anteriore.",biomeccanica:"Movimento unilaterale che richiede un lavoro di stabilizzazione significativamente superiore allo squat bilaterale, coinvolgendo in modo pi\xF9 marcato i muscoli stabilizzatori dell'anca (medio gluteo) oltre al quadricipite/gluteo come motori primari \u2014 utile anche per identificare e correggere asimmetrie tra i due lati.",errore:"Passo troppo corto che porta il ginocchio anteriore oltre la punta del piede in modo marcato: aumenta lo stress sul tendine rotuleo \u2014 un passo sufficientemente lungo permette al ginocchio di restare sostanzialmente sopra la caviglia nel punto pi\xF9 basso del movimento."},gamb_calf_press_orizz:{setup:"Sdraiato alla Leg Press orizzontale, ginocchia completamente distese e bloccate, punte dei piedi sul bordo inferiore della pedana, talloni liberi di scendere oltre il bordo.",esecuzione:"Estensione della caviglia (plantarflessione) spingendo con l'avampiede, poi discesa controllata lasciando che i talloni scendano sotto il livello della pedana per un allungamento completo del polpaccio.",biomeccanica:"Con le ginocchia bloccate in estensione, il carico si concentra sul gastrocnemio (il capo del tricipite surale che attraversa anche il ginocchio, quindi pi\xF9 efficace quando la gamba \xE8 distesa) \u2014 la posizione orizzontale della Leg Press permette inoltre di caricare pesi elevati con un ROM completo grazie al bordo della pedana che permette la discesa del tallone oltre il piano di appoggio.",errore:"Flettere le ginocchia durante l'esecuzione: sposta il lavoro dal gastrocnemio al soleo (l'altro capo del tricipite surale, che lavora meglio a ginocchio flesso) \u2014 se l'obiettivo \xE8 il gastrocnemio, le ginocchia devono restare bloccate per tutta la serie."},gamb_calf_raise_mono_mp:{setup:"In piedi su una gamba sola sotto la barra del Multipower, avampiede su un rialzo, altra gamba sollevata da terra o appoggiata leggermente per equilibrio.",esecuzione:"Estensione della caviglia sulla gamba di appoggio, sollevandosi sulla punta, poi discesa controllata fino a un allungamento completo.",biomeccanica:"L'esecuzione monopodalica raddoppia effettivamente il carico relativo su ciascun polpaccio rispetto alla variante bipodalica a parit\xE0 di peso caricato, permettendo di raggiungere il cedimento con carichi assoluti pi\xF9 bassi e gestibili \u2014 utile anche per identificare e correggere asimmetrie di forza tra i due lati.",errore:"Usare eccessivamente l'appoggio della gamba libera per bilanciarsi e alleggerire il carico sulla gamba di lavoro: l'appoggio deve servire solo per l'equilibrio, non per condividere il carico."},gamb_calf_raise_piedi_mp:{setup:"In piedi sotto la barra del Multipower, avampiede su un rialzo (disco o step) per permettere la discesa del tallone, ginocchia distese.",esecuzione:"Estensione della caviglia sollevandosi sulle punte il pi\xF9 in alto possibile, poi discesa controllata fino a un allungamento completo del polpaccio sotto il livello del rialzo.",biomeccanica:"La posizione in piedi carica il gastrocnemio con il peso corporeo aggiuntivo del bilanciere, in una configurazione a catena cinetica chiusa (il piede \xE8 fisso a terra) che replica meglio il pattern funzionale della camminata/corsa rispetto alle varianti sedute o su macchina.",errore:"Rimbalzare rapidamente da una ripetizione all'altra usando l'elasticit\xE0 del tendine d'Achille invece del controllo muscolare: il polpaccio \xE8 un muscolo che tollera bene alte ripetizioni ma il rimbalzo riduce il tempo sotto tensione effettivo, diminuendo lo stimolo reale."},gamb_calf_raise_seduto_mp:{setup:"Seduto sotto la barra del Multipower o su macchina dedicata, ginocchia flesse a circa 90\xB0, avampiede su un rialzo.",esecuzione:"Estensione della caviglia sollevando i talloni, poi discesa controllata fino a un allungamento completo.",biomeccanica:"Con il ginocchio flesso, il gastrocnemio \xE8 biomeccanicamente accorciato e quindi meno efficace nel generare forza, spostando il lavoro primario verso il soleo \u2014 il muscolo profondo del polpaccio, composto prevalentemente da fibre a contrazione lenta, che risponde tipicamente meglio a volumi di lavoro pi\xF9 alti.",errore:"Considerare questa variante equivalente a quella in piedi per lo sviluppo del polpaccio: essendo un muscolo diverso (soleo vs gastrocnemio) come motore primario, entrambe le varianti sono necessarie per uno sviluppo completo del tricipite surale, non intercambiabili."},gamb_hip_thrust_machine:{setup:"Seduto o posizionato secondo il design della macchina Hip Thrust dedicata, schiena appoggiata, piastra di carico sui fianchi.",esecuzione:"Estensione dell'anca lungo la traiettoria guidata della macchina, contrazione di picco a fine movimento.",biomeccanica:"Stessa logica del Hip Thrust con bilanciere ma con la sicurezza e la comodit\xE0 aggiuntiva di una macchina dedicata \u2014 elimina il fastidio comune della barra che scivola o preme scomodamente sui fianchi, permettendo di concentrarsi interamente sulla contrazione del gluteo.",errore:"Stesso della variante con bilanciere: iperestendere la colonna invece di fermarsi all'allineamento busto-cosce."},gamb_hip_thrust_mp:{setup:"Schiena superiore appoggiata a una panca, barra del Multipower posizionata sui fianchi (con protezione imbottita), piedi appoggiati a terra larghezza spalle, ginocchia flesse a circa 90\xB0 nella posizione di massima contrazione.",esecuzione:"Estensione dell'anca sollevando il bacino verso l'alto fino a portare il busto in linea con le cosce, contrazione di picco dei glutei a fine movimento, poi discesa controllata.",biomeccanica:"\xC8 l'esercizio con il maggior grado di attivazione EMG del grande gluteo tra tutti quelli comunemente utilizzati, perch\xE9 la resistenza (il bilanciere) agisce lungo tutto l'arco di movimento dell'anca in una traiettoria orizzontale che replica perfettamente la linea di forza del gluteo come estensore dell'anca.",errore:"Iperestendere la colonna lombare all'apice del movimento invece di fermarsi quando busto e cosce sono allineati: l'iperestensione sposta il lavoro dalla contrazione del gluteo all'arco della zona lombare, aumentando lo stress sui dischi intervertebrali senza beneficio aggiuntivo."},gamb_hip_thrust_plate:{setup:"Come la variante a pacco pesi, ma con caricamento a dischi anzich\xE9 con selettore \u2014 setup secondo il design specifico della macchina.",esecuzione:"Estensione dell'anca lungo la traiettoria guidata, contrazione di picco a fine movimento.",biomeccanica:"Funzionalmente identica alla variante a pacco pesi, con la differenza che il caricamento a dischi permette incrementi di carico pi\xF9 precisi e generalmente consente carichi massimi superiori rispetto a un pacco pesi standard.",errore:"Stesso delle altre varianti Hip Thrust: iperestensione lombare a fine movimento invece della corretta contrazione glutea."},gamb_leg_curl_sdraiato:{setup:"Prono sulla macchina, caviglie agganciate sotto il rullo, ginocchia appena oltre il bordo del cuscino, anche in posizione neutra (non flesse come nella variante seduta).",esecuzione:"Flessione del ginocchio portando il rullo verso i glutei, poi ritorno controllato.",biomeccanica:"Con l'anca in posizione neutra (estesa), il capo lungo del bicipite femorale \xE8 relativamente accorciato rispetto alla variante seduta \u2014 questa configurazione tende a enfatizzare maggiormente il capo breve e i muscoli semitendinoso/semimembranoso nella porzione mediale dei femorali.",errore:"Sollevare il bacino dal cuscino durante lo sforzo: come nella variante seduta, indica che il carico sta superando la capacit\xE0 di controllo del ROM isolato al ginocchio."},gamb_leg_curl_seduto:{setup:"Seduto alla macchina, schienale regolato, caviglie agganciate sotto il rullo imbottito, ginocchia allineate con l'asse di rotazione della macchina.",esecuzione:"Flessione del ginocchio portando il rullo verso i glutei, poi ritorno controllato fino a quasi completa estensione.",biomeccanica:"La posizione seduta pone l'anca in flessione, il che allunga il capo lungo del bicipite femorale (che attraversa sia l'anca sia il ginocchio) rispetto alla variante sdraiata \u2014 una configurazione che secondo la letteratura su stretch-mediated hypertrophy favorisce lo stimolo su questo capo specifico dei femorali.",errore:"Sollevare i glutei dal sedile durante lo sforzo finale: indica un carico eccessivo per il ROM controllato \u2014 la contrazione deve avvenire nel ginocchio, non tramite un'estensione compensatoria dell'anca."},gamb_leg_extension:{setup:"Seduto alla macchina, schienale regolato, caviglie agganciate sotto il rullo imbottito, ginocchia allineate con l'asse di rotazione della macchina.",esecuzione:"Estensione del ginocchio sollevando il rullo fino a quasi completa distensione della gamba, contrazione di picco, poi discesa controllata.",biomeccanica:"Isolamento puro del quadricipite in un movimento monoarticolare \u2014 a differenza dei compound (squat, leg press), qui il quadricipite lavora da solo senza il contributo di glutei e femorali, rendendolo l'esercizio di riferimento per la connessione mente-muscolo su questo gruppo specifico.",errore:"Regolazione errata dell'altezza dello schienale rispetto al perno della macchina: se l'asse di rotazione del ginocchio non coincide con quello della macchina, si genera stress di taglio anomalo sull'articolazione durante il movimento."},gamb_leg_press_45:{setup:"Sdraiato alla Leg Press 45\xB0, piedi sulla pedana larghezza spalle o poco pi\xF9, posizionati a met\xE0 altezza della pedana, schiena e bacino ben aderenti allo schienale.",esecuzione:"Discesa flettendo le ginocchia fino a circa 90\xB0 (o quando il bacino inizia a staccarsi dallo schienale, quello \xE8 il limite reale del ROM sicuro), poi spinta in estensione senza bloccare completamente le ginocchia con uno scatto.",biomeccanica:"La traiettoria inclinata a 45\xB0 e il supporto completo della schiena permettono di caricare il quadricipite con pesi molto elevati eliminando quasi interamente lo stress assiale sulla colonna vertebrale tipico dello squat \u2014 un vantaggio specifico per chi ha limitazioni lombari o vuole massimizzare il carico sulle gambe isolando la colonna dal lavoro.",errore:"Scendere oltre il punto in cui il bacino si stacca dallo schienale (ROM eccessivo): quando questo accade, la flessione aggiuntiva avviene nella zona lombare invece che nell'anca/ginocchio, esponendo la colonna a uno stress in flessione sotto carico assiale elevato."},gamb_leg_press_orizz:{setup:"Seduto alla Leg Press orizzontale, schiena aderente allo schienale, piedi sulla pedana larghezza spalle.",esecuzione:"Discesa flettendo le ginocchia verso il petto, poi spinta in estensione lungo la traiettoria orizzontale fissa.",biomeccanica:"Rispetto alla Leg Press 45\xB0, la traiettoria orizzontale cambia leggermente la distribuzione del carico tra quadricipite e glutei \u2014 generalmente considerata una variante che pone meno stress compressivo sulla zona lombare rispetto alla 45\xB0, per via dell'angolo di spinta pi\xF9 orizzontale.",errore:"Stesso della Leg Press 45\xB0: lasciare che il bacino si stacchi dallo schienale in fondo al movimento sposta il carico dalla gamba alla colonna lombare in modo scorretto."},gamb_pendulum_squat:{setup:"Alla macchina Panatta Pendulum Squat, schiena e spalle appoggiate al supporto imbottito, piedi sulla pedana, che si muove lungo un arco a pendolo anzich\xE9 una traiettoria lineare.",esecuzione:"Discesa flettendo le ginocchia lungo l'arco pendolare della macchina, poi risalita in estensione.",biomeccanica:"La traiettoria a pendolo (anzich\xE9 lineare come in una Leg Press standard) \xE8 progettata per seguire pi\xF9 fedelmente l'arco naturale del movimento di squat, con una curva di resistenza che tende ad aumentare nella porzione pi\xF9 profonda del ROM \u2014 dove il quadricipite ha generalmente meno leva meccanica, offrendo quindi uno stimolo bilanciato lungo tutto il movimento.",errore:"Interrompere il movimento prima di raggiungere la profondit\xE0 che la traiettoria a pendolo rende accessibile in sicurezza: uno dei vantaggi specifici di questa macchina \xE8 permettere un ROM profondo con la colonna completamente supportata, non sfruttarlo ne vanifica il beneficio principale."},gamb_power_squat:{setup:"Alla macchina Panatta Power Squat, posizionamento secondo il design specifico (tipicamente spalle sotto i cuscini imbottiti, piedi sulla pedana), che offre una traiettoria guidata simile a uno squat ma con supporto strutturale.",esecuzione:"Discesa flettendo anche e ginocchia lungo la traiettoria guidata della macchina, poi risalita in estensione.",biomeccanica:"Macchina dedicata che replica il pattern motorio dello squat con un grado di guida/sicurezza superiore al Multipower, spesso con una traiettoria che si adatta meglio all'arco naturale di movimento dell'anca durante lo squat rispetto a un binario puramente verticale.",errore:"Non sfruttare il ROM completo che la macchina permette per timore infondato: essendo una macchina progettata specificamente per il pattern squat con vincoli di sicurezza incorporati, il ROM completo indicato dal design \xE8 generalmente sicuro da utilizzare."},gamb_squat_mp:{setup:"In piedi sotto la barra del Multipower, piedi larghezza spalle o poco pi\xF9, punte leggermente ruotate verso l'esterno, barra appoggiata sui trapezi.",esecuzione:"Discesa flettendo simultaneamente anche e ginocchia, mantenendo la colonna neutra, fino a raggiungere almeno il parallelo (coscia parallela al pavimento) o oltre secondo mobilit\xE0, poi risalita spingendo attraverso il centro del piede.",biomeccanica:"Il vincolo verticale del Multipower riduce drasticamente il compito di stabilizzazione multidirezionale richiesto dallo squat con bilanciere libero, permettendo di caricare vicino al vero cedimento con un margine di sicurezza molto superiore \u2014 coerente con la filosofia HD che privilegia attrezzi stabili per il lavoro a cedimento.",errore:"Ginocchia che collassano verso l'interno (valgismo) durante la risalita, specialmente nelle ultime ripetizioni vicino al cedimento: il ginocchio deve seguire la direzione della punta del piede per tutta la serie, indipendentemente dalla fatica accumulata."},gamb_stacco_rumeno_man:{setup:"In piedi, manubri tenuti davanti alle cosce, ginocchia con flessione minima e fissa per tutto il movimento, colonna neutra.",esecuzione:"Flessione dell'anca (hip hinge) spingendo il bacino indietro mentre il busto si inclina in avanti, manubri che scorrono lungo le gambe restando vicini al corpo, fino a sentire un allungamento marcato dei femorali (tipicamente a met\xE0 polpaccio o poco sopra), poi estensione dell'anca per tornare eretti.",biomeccanica:"Movimento di hip hinge puro (a differenza dello squat, il ginocchio si muove pochissimo) che allunga i femorali sotto carico nella loro funzione di estensori dell'anca \u2014 uno degli esercizi pi\xF9 efficaci per lo stimolo eccentrico sui femorali, il gruppo muscolare pi\xF9 soggetto a infortuni da sprint/decelerazione quando debole.",errore:"Flettere il ginocchio durante la discesa trasformandolo in uno stacco da terra classico: il ginocchio deve restare a flessione quasi costante \u2014 se si piega progressivamente, il movimento sposta l'enfasi verso i quadricipiti e perde la specificit\xE0 sui femorali."},pett_chest_press:{setup:"Seduto alla macchina a pacco pesi, schienale regolato in modo che le maniglie siano all'altezza del petto medio, presa larga standard.",esecuzione:"Spinta in avanti tramite estensione del gomito e adduzione orizzontale della spalla, lungo la traiettoria fissa della macchina, poi ritorno controllato fino a un buon allungamento pettorale.",biomeccanica:"La traiettoria vincolata della macchina permette di concentrare tutto lo sforzo sul cedimento muscolare vero senza il compito aggiuntivo di stabilizzazione richiesto dalla panca piana con bilanciere \u2014 coerente con la filosofia HD, che privilegia attrezzi stabili per massimizzare la sicurezza vicino al cedimento. La stessa macchina, a presa stretta, allena i tricipiti (v. Chest Press a pacco pesi, presa stretta) \u2014 due esercizi diversi sullo stesso attrezzo.",errore:"Regolazione errata dell'altezza del sedile: se le maniglie non sono allineate con il petto medio, il movimento carica in modo scorretto la spalla o il petto alto/basso invece del petto medio target."},pett_chest_press_conv:{setup:"Seduto alla macchina a dischi con bracci convergenti indipendenti, un disco per lato inserito su ciascuna leva, maniglie regolate all'altezza del petto medio. I due bracci si muovono indipendentemente \u2014 l'esercizio \xE8 eseguibile anche a un braccio alla volta.",esecuzione:"Spinta in avanti seguendo la traiettoria convergente di ciascun braccio \u2014 le mani si avvicinano progressivamente verso il centro man mano che il movimento procede verso l'estensione completa. Se eseguito a due braccia, i due lati lavorano comunque in modo indipendente l'uno dall'altro.",biomeccanica:"L'indipendenza dei due bracci impedisce al lato pi\xF9 forte di compensare quello pi\xF9 debole \u2014 a differenza di una macchina a pacco pesi con maniglia unica collegata a un solo stack, qui ogni lato deve generare la propria forza per l'intero ROM, utile per correggere asimmetrie. La convergenza finale replica inoltre meglio la naturale adduzione orizzontale del braccio rispetto a una traiettoria parallela fissa, con una contrazione di picco del grande pettorale pi\xF9 completa a fine corsa.",errore:"Lasciare che un braccio pi\xF9 forte 'aiuti' l'altro nella variante bilaterale (es. spingendo pi\xF9 velocemente e ruotando il busto verso il lato debole): se noti asimmetria di velocit\xE0 tra i due bracci, vale la pena eseguire alcune serie a un braccio alla volta per isolare e correggere lo squilibrio."},pett_croci_alti:{setup:"In piedi al centro tra due carrucole alte, maniglie impugnate sopra la testa, un passo avanti rispetto alle colonne, gomiti leggermente flessi e fissi.",esecuzione:"Le mani partono alte ai lati della testa e scendono in un arco verso il basso e verso il centro, incontrandosi davanti al basso ventre o alle cosce \u2014 traiettoria dall'alto verso il basso.",biomeccanica:"Traiettoria opposta e complementare alle croci ai cavi bassi: replica la linea di forza delle fibre superiori/clavicolari del grande pettorale, che tirano il braccio dall'alto verso il basso e verso il centro \u2014 insieme, le due varianti ai cavi coprono l'intero spettro di angolazioni del pettorale che nessun singolo esercizio con manubri pu\xF2 replicare da solo.",errore:"Stesso delle croci basse: flettere progressivamente i gomiti trasforma l'isolamento in una spinta, vanificando lo scopo specifico dell'esercizio."},pett_croci_bassi:{setup:"In piedi al centro tra due carrucole basse, un passo avanti rispetto alle colonne, maniglie impugnate, braccia leggermente flesse ai gomiti, palmi verso l'alto/avanti.",esecuzione:"Le mani partono basse ai lati del corpo e salgono in un arco verso l'alto e verso il centro, incontrandosi davanti al petto o sopra \u2014 traiettoria dal basso verso l'alto, da cui il nome.",biomeccanica:"Questa traiettoria replica la linea di trazione delle fibre inferiori/sternali del grande pettorale, che nella loro azione naturale tirano il braccio verso il basso e verso il centro \u2014 la carrucola bassa permette di allenare questa specifica linea di forza in modo che nessun manubrio (limitato dalla sola gravit\xE0 verticale) pu\xF2 replicare.",errore:"Piegare eccessivamente i gomiti trasformando il movimento in una spinta: come tutte le croci, l'angolo del gomito deve restare pressoch\xE9 costante, il movimento avviene alla spalla."},pett_croci_incl_man:{setup:"Sdraiato su panca inclinata 30-45\xB0, manubri tenuti sopra il petto con gomiti leggermente flessi (angolo fisso mantenuto per tutta la serie), palmi rivolti l'uno verso l'altro.",esecuzione:"Apertura delle braccia in un arco ampio fino a sentire un allungamento pettorale marcato, poi richiusura seguendo la stessa traiettoria, senza flettere ulteriormente i gomiti durante il movimento.",biomeccanica:"Essendo un movimento di isolamento (solo l'articolazione della spalla si muove, il gomito resta a angolo fisso), il grande pettorale lavora attraverso l'intero ROM in adduzione orizzontale \u2014 la fase di massimo allungamento a braccia aperte \xE8 dove si concentra il maggior stimolo secondo la letteratura su stretch-mediated hypertrophy.",errore:"Flettere progressivamente i gomiti durante la risalita (trasformando le croci in una spinta): l'angolo del gomito va fissato all'inizio e mantenuto costante \u2014 se cambia, l'esercizio non \xE8 pi\xF9 un isolamento puro."},pett_croci_medi:{setup:"In piedi al centro tra due carrucole regolate all'altezza del petto, maniglie impugnate, braccia leggermente flesse e fisse.",esecuzione:"Le mani partono aperte ai lati e si chiudono verso il centro all'altezza del petto, mantenendo l'angolo del gomito costante per tutto il movimento.",biomeccanica:"Con la carrucola all'altezza del petto, la traiettoria di trazione \xE8 orizzontale pura \u2014 la configurazione che pi\xF9 si avvicina alla linea di forza del fascio sternale centrale del grande pettorale, con il vantaggio della tensione costante del cavo che il manubrio (soggetto solo alla gravit\xE0) non offre nella stessa misura in questa angolazione.",errore:"Regolare le carrucole troppo alte o basse rispetto al petto: la specificit\xE0 di questo esercizio dipende dall'allineamento orizzontale \u2014 se le carrucole non sono all'altezza del petto, diventa semplicemente una variante delle croci alte o basse."},pett_croci_piana_man:{setup:"Sdraiato su panca piana, manubri tenuti sopra il petto con gomiti leggermente flessi e fissi, palmi rivolti l'uno verso l'altro.",esecuzione:"Apertura delle braccia in arco fino a un allungamento pettorale marcato, poi richiusura seguendo la stessa traiettoria senza flettere ulteriormente i gomiti.",biomeccanica:"Isola il fascio sternale (medio) del grande pettorale attraverso l'intero ROM di adduzione orizzontale \u2014 la panca piana pone il muscolo nell'angolazione pi\xF9 centrale rispetto alle varianti inclinate/declinate.",errore:"Scendere troppo in basso con i manubri superando il piano delle spalle: aumenta lo stress sull'articolazione gleno-omerale nella sua posizione di massima vulnerabilit\xE0 senza beneficio aggiuntivo per il petto."},pett_dist_incl_mp:{setup:"Sdraiato su panca inclinata 30-45\xB0 posizionata sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle.",esecuzione:"Discesa della barra verso la parte alta del petto, gomiti che scendono a circa 45-70\xB0 dal busto, poi spinta in estensione lungo la traiettoria verticale fissa.",biomeccanica:"La guida verticale del Multipower elimina la necessit\xE0 di stabilizzare il bilanciamento laterale/orizzontale della barra, permettendo di concentrarsi sul cedimento del petto alto senza il compito aggiuntivo di coordinazione richiesto dal bilanciere libero.",errore:"Posizionare la panca troppo lontana o vicina rispetto alla traiettoria verticale della barra: se il punto di discesa non cade naturalmente sul petto alto, la traiettoria fissa forza un percorso scorretto per le spalle."},pett_dist_piana_mp:{setup:"Sdraiato su panca piana sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle.",esecuzione:"Discesa della barra verso il petto medio, gomiti a circa 45-70\xB0 dal busto, poi spinta in estensione lungo la traiettoria verticale fissa.",biomeccanica:"Come le altre varianti Multipower, la traiettoria verticale vincolata elimina il compito di stabilizzazione laterale richiesto dal bilanciere libero, permettendo di concentrare lo sforzo sul cedimento muscolare vero con margine di sicurezza superiore.",errore:"Gomiti troppo aperti a 90\xB0 dal busto durante la discesa: aumenta lo stress sulla capsula anteriore della spalla \u2014 un angolo di 45-70\xB0 \xE8 generalmente il compromesso pi\xF9 sicuro tra reclutamento pettorale e salute articolare."},pett_pec_deck:{setup:"Seduto alla macchina Pec Deck, schiena appoggiata allo schienale, avambracci o mani sulle leve/maniglie imbottite, gomiti leggermente flessi.",esecuzione:"Adduzione orizzontale delle braccia portando le leve a incontrarsi davanti al petto, poi ritorno controllato fino a un buon allungamento pettorale.",biomeccanica:"Macchina di isolamento puro per il grande pettorale con traiettoria vincolata \u2014 spesso dotata di camma che varia la resistenza lungo il ROM per adattarsi alla curva di forza naturale del muscolo, offrendo tensione pi\xF9 uniforme rispetto alle croci con manubri dove la resistenza gravitazionale varia con l'angolo.",errore:"Regolare male l'altezza del sedile: se i gomiti non sono allineati all'altezza delle spalle, il movimento carica in modo scorretto l'articolazione invece di isolare pulitamente il pettorale."},pett_power_smith_incl:{setup:"Seduto o sdraiato alla macchina Power Smith inclinata, presa sulle maniglie secondo la regolazione della macchina, traiettoria vincolata dal sistema guidato.",esecuzione:"Spinta in avanti/alto lungo il percorso fisso della macchina, che replica il movimento della panca inclinata con manubri ma con stabilit\xE0 e sicurezza aggiuntive.",biomeccanica:"Il sistema Dual System Upper offre tipicamente una traiettoria convergente che si adatta meglio alla biomeccanica naturale della spalla rispetto a un Multipower a traiettoria puramente verticale \u2014 un compromesso tra la libert\xE0 di movimento dei manubri e la sicurezza di una macchina guidata.",errore:"Regolare male l'altezza del sedile rispetto alle maniglie: se il punto di partenza non allinea correttamente spalla-gomito-maniglia, la traiettoria fissa della macchina pu\xF2 creare un percorso scorretto per l'articolazione della spalla."},pett_spinte_decl_man:{setup:"Sdraiato su panca declinata (testa pi\xF9 bassa dei piedi), manubri tenuti all'altezza del petto basso.",esecuzione:"Spinta dei manubri verso l'alto convergendo leggermente, poi discesa controllata verso la parte bassa del petto.",biomeccanica:"La declinazione sposta l'enfasi verso il fascio sternale-costale (basso) del grande pettorale \u2014 la porzione del muscolo pi\xF9 difficile da isolare con esercizi piani o inclinati, che spesso resta relativamente sotto-sviluppata rispetto al petto alto in chi allena prevalentemente panca piana/inclinata.",errore:"Declinazione eccessiva: oltre un certo angolo il vantaggio biomeccanico specifico per il petto basso non aumenta ulteriormente, mentre aumenta il disagio posturale (afflusso di sangue alla testa) \u2014 un'inclinazione moderata \xE8 sufficiente."},pett_spinte_incl_man:{setup:"Sdraiato su panca inclinata 30-45\xB0, manubri tenuti all'altezza del petto, gomiti sotto i polsi, avambracci verticali.",esecuzione:"Spinta dei manubri verso l'alto convergendo leggermente verso il centro senza farli toccare, poi discesa controllata fino a sentire un buon allungamento pettorale, senza far scendere le spalle sotto il piano della panca.",biomeccanica:"L'inclinazione della panca sposta l'enfasi verso il fascio clavicolare (alto) del grande pettorale, che si inserisce con un'angolazione diversa rispetto al fascio sternale \u2014 oltre i 45\xB0 di inclinazione il lavoro passa progressivamente al deltoide anteriore, motivo per cui l'angolo ottimale per il petto alto resta tipicamente tra 30\xB0 e 45\xB0.",errore:"Inclinazione della panca eccessiva (oltre 60\xB0): trasforma l'esercizio in una spinta per spalle con contributo pettorale marginale \u2014 se senti pi\xF9 lavoro nella spalla anteriore che nel petto, l'angolo \xE8 troppo verticale."},pett_spinte_piana_man:{setup:"Sdraiato su panca piana, manubri tenuti all'altezza del petto medio, gomiti sotto i polsi.",esecuzione:"Spinta dei manubri verso l'alto convergendo leggermente verso il centro, poi discesa controllata fino a un buon allungamento, senza far scendere eccessivamente le spalle (che aumenterebbe stress articolare senza beneficio aggiuntivo).",biomeccanica:"Rispetto alla Chest Press guidata, i manubri permettono un ROM leggermente pi\xF9 ampio (le mani non sono vincolate a una traiettoria fissa) e richiedono stabilizzazione attiva della spalla lungo tutto il movimento \u2014 un compound pi\xF9 completo ma con margine di sicurezza inferiore vicino al vero cedimento.",errore:"Far toccare i manubri in alto bloccando i gomiti con uno scatto: la fase finale va controllata, non usata come punto di riposo articolare."},schi_chest_supported_row:{setup:"Seduto o prono con il petto appoggiato al cuscino della macchina, presa sulle maniglie, braccia distese in avanti a inizio movimento.",esecuzione:"Trazione delle maniglie verso il busto, gomiti che passano vicino ai fianchi, scapole che si retraggono, poi ritorno controllato.",biomeccanica:"Come il rematore su panca inclinata con manubri, l'appoggio del petto elimina completamente il compenso lombare \u2014 la versione a macchina aggiunge stabilit\xE0 e permette di caricare progressivamente senza il compito di bilanciamento dei manubri liberi.",errore:"Staccare il petto dal cuscino nella fase di massimo sforzo: vanifica il vantaggio specifico della macchina, che \xE8 proprio l'eliminazione di qualsiasi compenso del tronco."},schi_lat_machine:{setup:"Seduto alla Lat Machine, cosce bloccate sotto i cuscini di sicurezza, presa prona larga (oltre la larghezza delle spalle) sulla barra dritta, busto leggermente inclinato indietro (non eccessivamente).",esecuzione:"Trazione della barra verso la parte alta del petto, guidando con i gomiti verso il basso e indietro, poi ritorno controllato fino a un buon allungamento del dorsale.",biomeccanica:"La presa prona larga limita il coinvolgimento del bicipite (che lavora meglio in supinazione) rispetto alle prese pi\xF9 strette, isolando maggiormente il gran dorsale come motore dell'estensione della spalla \u2014 contrariamente alla convinzione diffusa, l'evidenza EMG mostra che la larghezza della presa ha un effetto modesto e incoerente sulla distribuzione del carico ALL'INTERNO del dorsale stesso (che \xE8 un muscolo ampio ma anatomicamente uniforme, non diviso in capi distinti come tricipite o deltoide): il vantaggio reale di variare la presa nel tempo \xE8 soprattutto articolare e di gestione del volume su bicipite, non un 'targeting' di zone diverse della schiena.",errore:"Inclinare eccessivamente il busto all'indietro e usare lo slancio del tronco per tirare la barra: trasforma l'esercizio in una sorta di rematore inverso, riducendo il contributo isolato del dorsale."},schi_lat_machine_imp_stretta_inv:{setup:"Seduto alla Lat Machine, cosce bloccate sotto i cuscini, presa supina (palmi verso il viso) larghezza spalle o poco meno sulla barra dritta o con maniglia a V, busto leggermente inclinato indietro.",esecuzione:"Trazione verso la parte alta del petto, gomiti che scendono lungo i fianchi, con un range di movimento tipicamente pi\xF9 ampio della presa larga (i gomiti possono scendere oltre il busto), poi ritorno controllato.",biomeccanica:"La presa supina pone il bicipite in una posizione meccanicamente favorevole (stesso principio delle trazioni a presa supina), aumentandone sensibilmente il contributo rispetto alla presa prona larga \u2014 utile se il dorsale \xE8 il fattore limitante e serve un aiuto sinergico per completare le ripetizioni, ma da tenere in conto nella gestione del volume totale sui bicipiti nella seduta.",errore:"Considerarla necessaria per allenare una parte 'diversa' del dorsale rispetto alla presa larga: il vantaggio reale \xE8 il maggior coinvolgimento del bicipite e il ROM potenzialmente pi\xF9 ampio, non un reclutamento selettivo di fibre diverse del gran dorsale."},schi_lat_machine_neutra:{setup:"Seduto alla Lat Machine con maniglia a V o doppia maniglia neutra dedicata agganciata alla carrucola, cosce bloccate sotto i cuscini, presa neutra (palmi rivolti l'uno verso l'altro).",esecuzione:"Trazione della maniglia verso la parte alta del petto, gomiti che scendono vicino ai fianchi, poi ritorno controllato fino a un buon allungamento del dorsale.",biomeccanica:"La presa neutra \xE8 generalmente la pi\xF9 confortevole per l'articolazione della spalla e del polso, con un coinvolgimento del bicipite intermedio tra la presa prona e quella supina \u2014 una buona opzione di rotazione per chi ha fastidi articolari con le altre due prese, mantenendo comunque un carico ben distribuito sul dorsale.",errore:"Usare una maniglia troppo stretta che costringe i gomiti a incrociarsi davanti al busto in alto: la maniglia a V va scelta con un'apertura che permetta ai gomiti di scendere lungo una traiettoria naturale, non forzata verso il centro."},schi_pulldown_braccia_tese:{setup:"In piedi di fronte alla carrucola alta, barra dritta o corda impugnata, braccia quasi completamente distese sopra la testa a inizio movimento.",esecuzione:"Senza flettere i gomiti, porta la barra verso il basso fino alle cosce tramite estensione della spalla, poi ritorno controllato fino sopra la testa.",biomeccanica:"Isola il gran dorsale nella sua funzione di estensore della spalla, escludendo quasi completamente il bicipite (che invece interviene significativamente in tutte le trazioni/pulldown con gomito flesso) \u2014 utile come esercizio di rifinitura o come primo esercizio per pre-affaticare il dorsale prima di un compound.",errore:"Flettere i gomiti durante la discesa: trasforma l'esercizio in un pulldown normale, perdendo l'isolamento specifico che ne \xE8 la ragione d'essere \u2014 i gomiti devono restare quasi rigidi, con solo una minima flessione naturale."},schi_pulley_ombelico:{setup:"Seduto alla carrucola bassa, piedi sulla pedana, ginocchia leggermente flesse, barra o maniglia larga impugnata.",esecuzione:"Trazione verso l'ombelico/parte bassa dell'addome (non verso il petto alto), gomiti che passano vicino ai fianchi, scapole retratte a fine movimento.",biomeccanica:"Tirare verso l'ombelico invece che verso il petto alto cambia l'angolazione di trazione enfatizzando maggiormente il trapezio inferiore e la porzione bassa del dorsale rispetto a un pulley con traiettoria pi\xF9 alta \u2014 un dettaglio di traiettoria che modifica sensibilmente quali fibre lavorano di pi\xF9.",errore:"Tirare verso il petto invece che verso l'ombelico: cambia la biomeccanica dell'esercizio, trasformandolo in una variante diversa (pulley al petto) con enfasi muscolare differente da quella intesa qui."},schi_pulley_petto:{setup:"Seduto alla carrucola bassa, piedi appoggiati alla pedana, ginocchia leggermente flesse, busto eretto, maniglia a triangolo o barra impugnata.",esecuzione:"Trazione della maniglia verso il petto, portando indietro le scapole e i gomiti, mantenendo il busto sostanzialmente fermo (una leggera inclinazione avanti/indietro \xE8 normale, ma non deve diventare il motore del movimento).",biomeccanica:"Il pulley basso allena il dorsale e i romboidi in un piano orizzontale, complementare al piano verticale delle trazioni/lat machine \u2014 insieme, le due direzioni di trazione (verticale e orizzontale) coprono l'intero spettro di azione del gran dorsale.",errore:"Usare il busto come motore principale (oscillando vistosamente avanti e indietro): il movimento deve venire principalmente dalle braccia e dalla scapola, non da uno slancio del tronco che scarica il lavoro sulla zona lombare."},schi_rematore_1man_piana:{setup:"Un ginocchio e una mano appoggiati su panca piana per stabilit\xE0, busto parallelo al pavimento, manubrio nell'altra mano, braccio disteso verso il basso.",esecuzione:"Trazione del manubrio verso il fianco, gomito che passa vicino al busto e sale verso l'alto/indietro, poi discesa controllata fino a un buon allungamento del dorsale.",biomeccanica:"L'appoggio su panca stabilizza completamente busto e colonna, permettendo un isolamento unilaterale del dorsale con la possibilit\xE0 di un ROM leggermente superiore (grazie alla rotazione libera del busto, se permessa) rispetto a un rematore bilaterale.",errore:"Ruotare eccessivamente il busto durante la trazione per aumentare il ROM percepito: una leggera rotazione naturale \xE8 normale, ma una rotazione vistosa introduce uno slancio che riduce l'isolamento del dorsale."},schi_rematore_2man_incl:{setup:"Sdraiato prono su panca inclinata (30-45\xB0), petto appoggiato al cuscino, un manubrio per mano, braccia distese verso il basso.",esecuzione:"Trazione dei manubri verso l'alto portando i gomiti indietro e verso l'alto, scapole che si retraggono, poi discesa controllata.",biomeccanica:"L'appoggio del petto sulla panca elimina completamente il compenso lombare (impossibile inarcare la schiena per aiutare il movimento), isolando il lavoro sul dorsale/romboidi/trapezio medio in modo pi\xF9 pulito di qualsiasi variante in piedi.",errore:"Sollevare il petto dal cuscino durante la trazione: se il busto si stacca dall'appoggio, parte dello slancio proviene dall'estensione della colonna invece che dalla trazione delle braccia \u2014 l'esercizio perde il suo vantaggio specifico."},schi_rematore_busto_flesso_mp:{setup:"In piedi sotto la barra del Multipower, busto flesso in avanti a circa 45-60\xB0 mantenendo la colonna neutra, presa prona o supina secondo variante, ginocchia leggermente flesse.",esecuzione:"Trazione della barra verso l'addome/petto basso lungo la traiettoria verticale fissa del Multipower, gomiti che passano vicino ai fianchi, poi discesa controllata.",biomeccanica:"La traiettoria verticale vincolata del Multipower elimina il compito di bilanciamento richiesto dal bilanciere libero nel rematore classico, permettendo di concentrarsi sulla trazione del dorsale senza il rischio di instabilit\xE0 lombare tipico del rematore libero pesante.",errore:"Estendere la colonna durante la trazione per generare slancio: il busto deve restare fisso nell'inclinazione di partenza \u2014 se la schiena si raddrizza a ogni ripetizione, lo slancio sta sostituendo il lavoro muscolare del dorsale."},schi_super_high_row:{setup:"Seduto o in piedi alla macchina Panatta Super High Row, presa sulle maniglie secondo la regolazione, busto stabilizzato dall'appoggio della macchina.",esecuzione:"Trazione delle maniglie verso il busto lungo la traiettoria alta e guidata della macchina, che replica un rematore con angolazione elevata rispetto ai rematori orizzontali classici.",biomeccanica:"L'angolazione 'alta' di questo rematore sposta l'enfasi verso il trapezio medio e i romboidi rispetto a un rematore orizzontale standard (pi\xF9 focalizzato su dorsale e trapezio inferiore) \u2014 utile per bilanciare lo sviluppo tra le diverse porzioni della schiena superiore.",errore:"Non sfruttare l'angolazione specifica della macchina inclinandosi in modo scorretto: mantenere la postura indicata dal design della macchina \xE8 essenziale per beneficiare della sua angolazione distintiva."},schi_tbar_row:{setup:"In piedi a cavalcioni del bilanciere ancorato a un'estremit\xE0, busto flesso in avanti a circa 45\xB0 mantenendo la colonna neutra, presa sulla maniglia a T o direttamente sulla barra.",esecuzione:"Trazione del bilanciere verso l'addome/petto basso, gomiti che passano vicino ai fianchi, poi discesa controllata mantenendo il busto stabile nell'inclinazione di partenza.",biomeccanica:"L'ancoraggio a un'estremit\xE0 crea un arco di movimento fisso che permette di caricare pesantemente il dorsale mantenendo comunque un certo grado di libert\xE0 rispetto a una macchina completamente vincolata \u2014 un compromesso tra il carico del rematore con bilanciere libero e la stabilit\xE0 di una traiettoria semi-guidata.",errore:"Estendere la colonna (raddrizzarsi) per generare slancio nella trazione: il busto deve restare fisso nell'inclinazione di partenza per tutta la serie, l'unico movimento voluto \xE8 quello delle braccia/scapole."},schi_trazioni_assistite:{setup:"In piedi o in ginocchio sulla piattaforma della macchina assistita, presa sulla barra fissa sopra la testa, contrappeso regolato secondo il livello di assistenza necessario.",esecuzione:"Trazione del corpo verso l'alto con la stessa meccanica delle trazioni libere, ma con una parte del peso corporeo compensata dal contrappeso della macchina.",biomeccanica:"Permette di allenare il pattern motorio e il reclutamento muscolare specifico delle trazioni a chi non ha ancora la forza per eseguirle a corpo libero, con un contrappeso regolabile che riduce progressivamente l'assistenza man mano che la forza aumenta \u2014 un ponte progressivo verso le trazioni libere.",errore:"Affidarsi troppo a lungo a un'assistenza eccessiva: il contrappeso va ridotto progressivamente nel tempo, altrimenti la macchina diventa una scorciatoia permanente invece di uno strumento di progressione."},schi_trazioni_neutra:{setup:"Sospeso a una barra con maniglie parallele (presa neutra, palmi rivolti l'uno verso l'altro), braccia distese.",esecuzione:"Trazione del corpo verso l'alto, gomiti che scendono verso il basso e leggermente indietro lungo i fianchi.",biomeccanica:"La presa neutra \xE8 generalmente la pi\xF9 confortevole per l'articolazione della spalla, riducendo lo stress rotazionale rispetto sia alla presa prona sia alla supina \u2014 un buon compromesso tra sollecitazione del dorsale e comfort articolare, spesso raccomandato per chi ha fastidi di spalla con le altre prese.",errore:"Stesso errore comune a tutte le trazioni: usare slancio del busto per completare le ripetizioni finali invece di fermarsi al vero cedimento controllato."},schi_trazioni_prona:{setup:"Sospeso alla barra, presa prona (palmi in avanti) larga o standard, braccia completamente distese, scapole depresse prima di iniziare (non partire con le spalle 'appese' passivamente).",esecuzione:"Trazione del corpo verso l'alto portando il petto verso la barra, guidando il movimento con i gomiti che scendono verso il basso e indietro, non tirando semplicemente con le mani.",biomeccanica:"La presa prona pone il gran dorsale nella configurazione biomeccanica pi\xF9 favorevole per l'adduzione dell'omero, con un contributo significativo anche del grande rotondo e dei romboidi \u2014 \xE8 considerato l'esercizio di riferimento per la larghezza della schiena.",errore:"Usare slancio (kipping) per generare il movimento invece di trazione controllata: oltre a ridurre lo stimolo muscolare, aumenta lo stress su spalla e colonna in un movimento dove il corpo \xE8 gi\xE0 in sospensione libera."},schi_trazioni_supina:{setup:"Sospeso alla barra, presa supina (palmi verso il viso) larghezza spalle o poco meno, braccia distese.",esecuzione:"Trazione del corpo verso l'alto portando il mento sopra la barra, con un contributo di flessione del gomito superiore rispetto alla presa prona per via della posizione del bicipite.",biomeccanica:"La presa supina pone il bicipite in una posizione meccanicamente pi\xF9 favorevole (il capo lungo \xE8 gi\xE0 in leggera pre-tensione), motivo per cui questa variante \xE8 tipicamente pi\xF9 semplice da eseguire per la maggior parte delle persone rispetto alla presa prona \u2014 un compromesso tra lavoro dorsale e assistenza del bicipite.",errore:"Considerarla un esercizio equivalente alla presa prona per la schiena: il maggior coinvolgimento del bicipite significa che il dorsale riceve uno stimolo relativamente inferiore a parit\xE0 di ripetizioni \u2014 utile come variante, non come sostituto."},spal_alzate_frontali_cavo:{setup:"In piedi di fronte alla carrucola bassa, barra o maniglia impugnata con presa prona, braccio disteso verso il basso davanti al corpo.",esecuzione:"Sollevamento della barra in avanti fino all'altezza delle spalle, gomito con flessione minima costante, poi discesa controllata.",biomeccanica:"Il cavo mantiene tensione costante sul deltoide anteriore per tutto il ROM, incluso il punto pi\xF9 basso dove il manubrio (soggetto solo alla gravit\xE0 verticale) perde quasi completamente il carico \u2014 un vantaggio specifico di questa variante rispetto a quella con pesi liberi.",errore:"Usare uno slancio del busto o delle gambe per avviare il sollevamento: come nella variante con manubri, il movimento deve essere isolato alla sola articolazione della spalla."},spal_alzate_frontali_man:{setup:"In piedi, manubri tenuti lungo i fianchi o davanti alle cosce, presa prona o neutra.",esecuzione:"Sollevamento di uno o entrambi i manubri in avanti fino all'altezza delle spalle (non oltre), gomito con flessione minima e costante, poi discesa controllata.",biomeccanica:"Isola il deltoide anteriore nella sua funzione di flessione della spalla \u2014 un fascio che riceve comunque un lavoro indiretto significativo da tutte le spinte per petto e spalle, motivo per cui \xE8 spesso il fascio meno bisognoso di lavoro diretto aggiuntivo nella maggior parte dei programmi.",errore:"Usare slancio del busto (inarcandosi all'indietro) per sollevare il peso: il movimento deve venire esclusivamente dalla flessione della spalla, non da un'oscillazione del tronco."},spal_alzate_laterali:{setup:"In piedi, manubri lungo i fianchi, gomiti con leggera flessione fissa, busto stabile.",esecuzione:"Sollevamento laterale dei manubri fino a circa l'altezza delle spalle (non oltre, per evitare l'impingement del sovraspinato), leggera rotazione del polso verso il basso (mignolo leggermente pi\xF9 alto del pollice) nella fase alta, poi discesa controllata.",biomeccanica:"Isola il deltoide laterale (mediale) nella sua funzione di abduzione della spalla \u2014 il fascio che contribuisce maggiormente alla larghezza visiva delle spalle ed \xE8 tipicamente il pi\xF9 sotto-allenato dai movimenti di spinta compound, che coinvolgono prevalentemente il deltoide anteriore.",errore:"Sollevare oltre l'altezza delle spalle o usare slancio (rimbalzo) partendo dai fianchi: entrambi gli errori riducono l'isolamento e aumentano il rischio di conflitto sub-acromiale ripetuto."},spal_alzate_laterali_cavo:{setup:"In piedi di fianco alla carrucola bassa, maniglia impugnata con il braccio che attraversa il corpo, gomito con leggera flessione fissa.",esecuzione:"Sollevamento laterale del braccio fino all'altezza della spalla, poi discesa controllata mantenendo tensione sul cavo per tutto il ROM.",biomeccanica:"A differenza del manubrio, il cavo mantiene tensione anche nella posizione di partenza (braccio lungo il fianco, dove il manubrio ha braccio di leva quasi nullo rispetto alla gravit\xE0) \u2014 la tensione costante rende questa variante spesso pi\xF9 efficace per il deltoide laterale nell'intero ROM.",errore:"Posizionarsi troppo lontano o vicino alla carrucola: la distanza determina l'angolo di trazione del cavo rispetto al braccio, e quindi dove nel ROM si concentra il carico maggiore."},spal_alzate_posteriori_incl:{setup:"Prono su panca inclinata 30-45\xB0, petto appoggiato al cuscino, manubri tenuti sotto le spalle, gomiti con leggera flessione fissa.",esecuzione:"Sollevamento laterale delle braccia (le mani si allontanano dal corpo verso i lati) fino a circa l'altezza del busto, scapole che si retraggono leggermente a fine movimento, poi discesa controllata.",biomeccanica:"L'appoggio del petto elimina il compenso lombare, isolando il deltoide posteriore \u2014 il fascio tipicamente pi\xF9 debole e sotto-allenato dei tre, nonostante il suo ruolo importante nella postura e nella salute della spalla contro la protrazione cronica.",errore:"Sollevare le braccia troppo indietro/in alto trasformando il movimento in un rematore: l'enfasi sul deltoide posteriore richiede una traiettoria pi\xF9 laterale che verso l'alto \u2014 se il movimento assomiglia a un rematore a braccia larghe, il romboidi/trapezio stanno rubando lavoro al deltoide."},spal_lateral_raise_machine:{setup:"Seduto alla macchina, braccia appoggiate ai cuscini laterali o presa sulle maniglie secondo il design, gomiti con leggera flessione.",esecuzione:"Abduzione della spalla lungo la traiettoria guidata della macchina fino all'altezza indicata dal design, poi ritorno controllato.",biomeccanica:"La traiettoria vincolata e spesso la curva di resistenza a camma rendono questa la variante pi\xF9 sicura e isolata per il deltoide laterale, particolarmente utile per lavorare vicino al vero cedimento senza il rischio di compensi tipico dei manubri liberi quando la fatica aumenta.",errore:"Sollevare le spalle (elevazione scapolare) invece di abdurre il braccio: se il trapezio superiore interviene visibilmente, il movimento sta compensando invece di isolare il deltoide laterale."},spal_lento_avanti_mp:{setup:"In piedi o seduto sotto la barra del Multipower, presa poco pi\xF9 larga delle spalle, bilanciere all'altezza delle clavicole.",esecuzione:"Spinta della barra verso l'alto lungo la traiettoria verticale fissa fino a quasi completa estensione, poi discesa controllata.",biomeccanica:"La traiettoria vincolata verticale del Multipower elimina il rischio di instabilit\xE0 laterale tipico della military press con bilanciere libero, permettendo di concentrarsi sul cedimento del deltoide anteriore in sicurezza.",errore:"Posizionarsi in modo che la traiettoria verticale della barra non passi vicino al viso durante la salita: se il percorso costringe a inclinare eccessivamente la testa indietro, la posizione sotto la barra va corretta."},spal_lento_man_seduto:{setup:"Seduto su panca con schienale verticale o leggermente inclinato, manubri all'altezza delle spalle, gomiti sotto i polsi, palmi in avanti o leggermente ruotati verso l'interno.",esecuzione:"Spinta dei manubri verso l'alto fino a quasi estendere completamente i gomiti (senza bloccarli con uno scatto), poi discesa controllata fino all'altezza delle spalle.",biomeccanica:"Movimento compound che carica primariamente il deltoide anteriore, con contributo significativo del deltoide laterale e del tricipite come sinergico nell'estensione del gomito \u2014 la posizione seduta con schienale elimina il compenso lombare tipico della variante in piedi.",errore:"Inarcare eccessivamente la parte bassa della schiena per aiutare la spinta finale: se lo schienale non impedisce questo compenso, la zona lombare sta assorbendo stress che dovrebbe restare sulla spalla."},spal_power_smith_vert:{setup:"Seduto alla macchina Power Smith verticale, presa sulle maniglie secondo la regolazione del sistema guidato.",esecuzione:"Spinta verso l'alto lungo il percorso fisso della macchina, che replica il movimento della shoulder press con manubri ma con stabilit\xE0 aggiuntiva.",biomeccanica:"Come per la variante Chest Press dello stesso sistema, il vantaggio \xE8 una traiettoria che si avvicina al movimento naturale della spalla pi\xF9 di un Multipower a binario puramente verticale, con la sicurezza di un sistema guidato.",errore:"Stesso di tutte le macchine guidate: una regolazione errata dell'altezza de
